<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Stampa combinata &mdash; F4 Rilievi</title>
  <style>
    body { background: #f5f6fa; font-size: 12px; }
    #modal-sel { position: fixed; inset: 0; z-index: 200; background: rgba(15,15,35,.55); display: flex; align-items: center; justify-content: center; }
    .sel-box { background: #fff; border-radius: 14px; padding: 32px 36px; max-width: 440px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
    .sel-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .sel-logo .lb { border: 2px solid #e53e3e; padding: 3px 9px; font-size: 18px; font-weight: 900; color: #1a1a2e; }
    .sel-logo .lt { font-size: 13px; font-weight: 700; color: #1a1a2e; }
    .sel-title { font-size: 15px; font-weight: 700; color: #1a1a2e; margin-bottom: 6px; }
    .sel-sub { font-size: 12px; color: #6b7280; margin-bottom: 22px; }
    .sel-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
    .sel-opt { display: flex; align-items: center; gap: 14px; border: 2px solid #e5e7eb; border-radius: 10px; padding: 12px 16px; cursor: pointer; transition: border-color .15s, background .15s; }
    .sel-opt:hover { border-color: #c7d2fe; background: #f5f3ff; }
    .sel-opt input[type=checkbox] { width: 18px; height: 18px; accent-color: #4f46e5; flex-shrink: 0; cursor: pointer; }
    .sel-opt.checked { border-color: #4f46e5; background: #eef2ff; }
    .sel-opt-ico { font-size: 20px; flex-shrink: 0; }
    .sel-opt-text .sel-opt-name { font-size: 13px; font-weight: 700; color: #1a1a2e; }
    .sel-opt-text .sel-opt-desc { font-size: 11px; color: #6b7280; }
    .sel-actions { display: flex; gap: 10px; }
    .btn-avvia { flex: 1; background: #4f46e5; color: #fff; border: none; border-radius: 8px; padding: 12px; font-size: 14px; font-weight: 700; cursor: pointer; }
    .btn-avvia:hover { background: #4338ca; }
    .btn-annulla { background: #f3f4f6; color: #374151; border: none; border-radius: 8px; padding: 12px 18px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-annulla:hover { background: #e5e7eb; }
    #toolbar { background: #1a1a2e; color: #fff; padding: 10px 18px; display: flex; align-items: center; gap: 8px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
    #toolbar h1 { font-size: 14px; margin: 0; flex: 1; font-weight: 600; }
    .btn-tb { border: none; border-radius: 6px; padding: 6px 13px; font-size: 12px; font-weight: 600; cursor: pointer; color: #fff; }
    .btn-tb-primary { background: #4f46e5; } .btn-tb-primary:hover { background: #4338ca; }
    .btn-tb-neutral { background: #374151; } .btn-tb-neutral:hover { background: #1f2937; }
    .btn-tb-sec { background: #6b7280; } .btn-tb-sec:hover { background: #4b5563; }
    #wrap { max-width: 1100px; margin: 20px auto; padding: 0 14px 48px; }
    #stato-msg { text-align: center; padding: 80px; color: #6b7280; font-size: 15px; }
    .sezione { margin-bottom: 30px; }
    .scheda-hdr { background: #fff; border: 2px solid #1a1a2e; border-radius: 8px; margin-bottom: 10px; overflow: hidden; page-break-inside: avoid; }
    .sh-top { display: grid; grid-template-columns: 110px 1fr 220px; border-bottom: 2px solid #1a1a2e; }
    .sh-logo { background: #1a1a2e; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; font-size: 10px; font-weight: 700; text-align: center; }
    .sh-logo .lb2 { border: 2px solid #e53e3e; padding: 3px 8px; font-size: 16px; font-weight: 900; letter-spacing: -1px; margin-bottom: 3px; }
    .sh-c { padding: 10px 14px; border-left: 2px solid #1a1a2e; border-right: 2px solid #1a1a2e; }
    .sh-d { padding: 10px 12px; }
    .sh-f { display: flex; align-items: baseline; gap: 6px; margin-bottom: 4px; font-size: 11px; }
    .sh-f label { font-weight: 700; color: #1a1a2e; font-size: 10px; min-width: 68px; white-space: nowrap; }
    .sh-f span { color: #374151; border-bottom: 1px solid #d1d5db; flex: 1; min-height: 13px; }
    .sh-badges { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }

    .sh-badge.green { background: #d1fae5; color: #065f46; }
    .sez-hdr { display: flex; align-items: center; gap: 12px; margin: 14px 0 10px; }
    .sez-hdr-line { flex: 1; height: 2px; background: #e5e7eb; }
    .sez-hdr-txt { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: #4f46e5; white-space: nowrap; }
    .strat-grid-c { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .strat-card-c { background: #fff; border: 1px solid #d1d5db; border-radius: 6px; padding: 7px; width: 140px; page-break-inside: avoid; }
    .strat-card-c img { width: 100%; height: 70px; object-fit: contain; background: #f9f9f9; border: 1px solid #e5e7eb; border-radius: 3px; margin-bottom: 4px; }
    .strat-card-c h4 { font-size: 10px; font-weight: 700; color: #1a1a2e; margin: 0 0 2px; }
    .strat-card-c .sq { font-size: 9px; color: #6b7280; line-height: 1.4; }
    .tbl-outer { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; overflow-x: auto; margin-bottom: 10px; }
    table.t-c { border-collapse: collapse; width: 100%; font-size: 11px; white-space: nowrap; }
    table.t-c thead tr.th-g th { background: #374151; color: #a5b4fc; padding: 3px 5px; text-align: center; font-size: 9px; font-weight: 700; text-transform: uppercase; border-right: 1px solid #4b5563; }
    table.t-c thead tr.th-m th { background: #1a1a2e; color: #fff; padding: 6px 6px; text-align: center; font-size: 10px; font-weight: 600; border-right: 1px solid #374151; }

    table.t-c td.tipo-cell { text-align: center; font-weight: 700; color: #4f46e5; }
    table.t-c td.dim-c { text-align: center; }

    .dc { font-size: 9px; color: #6b7280; font-style: italic; }
    .chk { display: inline-block; width: 10px; height: 10px; border: 1.5px solid #9ca3af; border-radius: 2px; background: #fff; }
    .chk.on { background: #e53e3e; border-color: #e53e3e; }
    td.gsep { border-left: 2px solid #d1d5db; }

    .leg-block { background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; padding: 8px 12px; margin-bottom: 10px; page-break-inside: avoid; }

    .acc-sublbl { font-size: 10px; font-weight: 700; color: #6b7280; margin-bottom: 2px; }

    .chip-n  { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 10px; font-weight: 700; background: #FFF3E0; color: #E65100; white-space: nowrap; }
    .chip-m  { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 10px; font-weight: 700; background: #F3E5F5; color: #6A1B9A; white-space: nowrap; }
    .acc-pl { flex: 1; font-size: 10px; font-weight: 600; color: #1a1a2e; font-family: monospace; background: #eef2ff; padding: 2px 8px; border-radius: 4px; }
    .mat-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-top: 6px; }
    .mat-c { border: 1px solid #e5e7eb; border-radius: 6px; padding: 7px; background: #fff; text-align: center; }
    .mat-c .mn { font-size: 9px; color: #6b7280; margin-bottom: 3px; }
    .mat-c .mv { font-size: 1rem; font-weight: 700; color: #1a1a2e; }
    .mat-c .mu { font-size: 8px; color: #6b7280; }
    table.t-posa { width: 100%; border-collapse: collapse; font-size: 11px; }
    table.t-posa thead th { background: #1a1a2e; color: #fff; padding: 7px 8px; text-align: left; font-size: 10px; font-weight: 600; white-space: nowrap; }
    table.t-posa thead th.c { text-align: center; }
    table.t-posa td { padding: 5px 8px; border-bottom: 1px solid #f0f0f6; color: #374151; }
    table.t-posa td.c { text-align: center; }
    .tr-sez td { background: #eef0f8; color: #3730a3; font-weight: 700; font-size: 9px; letter-spacing: .7px; text-transform: uppercase; padding: 3px 8px; border-top: 2px solid #e0e3f4; }
    .tr-voce.zero-row td { opacity: .4; }
    .tr-voce td.ore-f { text-align: center; font-weight: 700; color: #4f46e5; }
    .tr-tot td { background: #1a1a2e; color: #fff; font-weight: 700; padding: 7px 8px; font-size: 11px; }
    .tr-tot td.ore-f { text-align: center; color: #a5b4fc; font-size: 14px; }
    .posa-bottom { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .sum-block { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px 14px; }
    .sum-block h3 { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: #4f46e5; margin: 0 0 8px; padding-bottom: 4px; border-bottom: 2px solid #ede9fe; }
    .sum-row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 11px; border-bottom: 1px solid #f9f9ff; }
    .sum-row:last-child { border-bottom: none; }
    .sum-row .lbl { color: #6b7280; }
    .sum-row .val { font-weight: 700; color: #1a1a2e; text-align: right; }
    .sum-row.tot { border-top: 2px solid #ede9fe; margin-top: 3px; padding-top: 5px; }
    .sum-row.tot .val { color: #4f46e5; font-size: 13px; }
    .ore-grid-c { display: grid; grid-template-columns: repeat(5,1fr); gap: 8px; margin-top: 10px; }
    .ore-card-c { text-align: center; padding: 10px; background: #f9fafe; border-radius: 8px; border: 1px solid #e5e7eb; }
    .ore-card-c .ov { font-size: 24px; font-weight: 700; color: #4f46e5; line-height: 1.1; }
    .ore-card-c .ol { font-size: 9px; color: #6b7280; margin-top: 3px; text-transform: uppercase; letter-spacing: .3px; }
    .tipo-grid-c { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
    .tipo-chip-c { display: flex; align-items: center; gap: 4px; background: #f3f4f6; border-radius: 8px; padding: 3px 8px; font-size: 11px; }
    .tipo-chip-c .sig { font-weight: 700; color: #1a1a2e; }
    .tipo-chip-c .cnt { font-weight: 700; color: #4f46e5; }
    .tipo-chip-c.zero { opacity: .35; }
    @media print {
      @page { size: A4 landscape; margin: 7mm; }
      body { background: #fff; }
      #modal-sel { display: none !important; }
      #toolbar    { display: none !important; }
      #wrap { margin: 0; padding: 0; max-width: none; }
      .sezione-break { page-break-after: always; }
      .scheda-hdr { border-radius: 0; margin-bottom: 4px; }
      .sh-top { grid-template-columns: 90px 1fr 190px; }
      .sh-logo .lb2 { font-size: 13px; }
      .sh-f { font-size: 9px; margin-bottom: 2px; }
      .sh-f label { font-size: 9px; }
      .leg-block { padding: 5px 8px; border-radius: 0; }
      .leg-grid { gap: 5px; }
      .leg-sec h4 { font-size: 7px; }
      .leg-row { font-size: 7px; }
      .strat-card-c { width: 110px; padding: 5px; }
      .strat-card-c img { height: 55px; }
      .strat-card-c h4 { font-size: 8px; }
      .strat-card-c .sq { font-size: 7px; }
      .tbl-outer { border-radius: 0; overflow: visible; }
      table.t-c { font-size: 8px; white-space: normal; }
      table.t-c thead tr.th-g th { padding: 2px 3px; font-size: 7px; }
      table.t-c thead tr.th-m th { padding: 3px 4px; font-size: 8px; }
      table.t-c td { padding: 2px 4px; font-size: 8px; }
      .dm { font-size: 8px; } .dc { font-size: 7px; }
      .acc-g { border-radius: 0; margin-bottom: 5px; }
      .acc-gh { padding: 4px 8px; background: #eee !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .acc-gimg { width: 34px; height: 24px; }
      .acc-gtit { font-size: .78rem; }
      .acc-gb { padding: 5px 8px; }
      .chip-mq,.chip-n,.chip-m { font-size: 8px; padding: 1px 5px; }
      .acc-pl { font-size: 8px; }
      .mat-c .mn { font-size: 7px; } .mat-c .mv { font-size: .85rem; } .mat-c .mu { font-size: 6px; }
      table.t-posa { font-size: 8px; }
      table.t-posa thead th { padding: 3px 5px; font-size: 7px; }
      table.t-posa td { padding: 2px 5px; font-size: 8px; }
      .tr-sez td { font-size: 7px; padding: 2px 5px; }
      .tr-voce.zero-row { display: none !important; }
      .ore-card-c .ov { font-size: 16px; }
      .ore-card-c .ol { font-size: 7px; }
      .sum-row { font-size: 9px; }
      .tipo-chip-c { font-size: 9px; }
    }
  </style>
</head>
<body>

<div id="modal-sel">
  <div class="sel-box">
    <div class="sel-logo"><div class="lb">[F4]</div><div class="lt">GRUPPO F4 &mdash; F4 Rilievi</div></div>
    <div class="sel-title">&#128438; Stampa combinata</div>
    <div class="sel-sub">Seleziona i report da includere nella stampa</div>
    <div class="sel-options">
      <label class="sel-opt checked" id="opt-rilievo">
        <input type="checkbox" id="chk-rilievo" checked onchange="updOpt(this,'opt-rilievo')">
        <span class="sel-opt-ico">&#128196;</span>
        <span class="sel-opt-text">
          <div class="sel-opt-name">Report Rilievo</div>
          <div class="sel-opt-desc">Legenda, stratigrafie, tabella posizioni con dimensioni calcolate</div>
        </span>
      </label>
      <label class="sel-opt checked" id="opt-acc">
        <input type="checkbox" id="chk-acc" checked onchange="updOpt(this,'opt-acc')">
        <span class="sel-opt-ico">&#128202;</span>
        <span class="sel-opt-text">
          <div class="sel-opt-name">Report Accessori</div>
          <div class="sel-opt-desc">Accessori per tipo con quantit&agrave;, barre coprifili, materiali posa</div>
        </span>
      </label>
      <label class="sel-opt checked" id="opt-posa">
        <input type="checkbox" id="chk-posa" checked onchange="updOpt(this,'opt-posa')">
        <span class="sel-opt-ico">&#9201;</span>
        <span class="sel-opt-text">
          <div class="sel-opt-name">Report Posa</div>
          <div class="sel-opt-desc">Voci di posa con ore calcolate, riepilogo aree, ore totali</div>
        </span>
      </label>
    </div>
    <div class="sel-actions">
      <button class="btn-annulla" onclick="history.back()">&#8592; Annulla</button>
      <button class="btn-avvia" onclick="avvia()">&#128438; Genera e stampa</button>
    </div>
  </div>
</div>

<div id="toolbar" style="display:none">
  <h1 id="tb-titolo">Stampa combinata</h1>
  <button class="btn-tb btn-tb-sec" onclick="riaprModal()">&#9881;&#65039; Selezione</button>
  <button class="btn-tb btn-tb-neutral" onclick="history.back()">&#8592; Indietro</button>
  <button class="btn-tb btn-tb-primary" onclick="window.print()">&#128438; Stampa / PDF</button>
</div>

<div id="wrap">
  <div id="stato-msg">Seleziona i report e clicca "Genera e stampa".</div>
  <div id="out" style="display:none"></div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
var currentUser = Auth.requireLogin(); if (!currentUser) throw new Error('not logged');
var idRilievo = (new URLSearchParams(window.location.search)).get('idRilievo') ||
                (new URLSearchParams(window.location.search)).get('id');
if (!idRilievo) history.back();

var STRAT_IMG = (typeof APP_CONFIG!=='undefined'&&APP_CONFIG.STRAT_IMAGES)?APP_CONFIG.STRAT_IMAGES:{};
var TIPO_DESC = {'I':'Ingresso','F':'Finestra apribile','PF':'Porta finestra','FF':'Finestra fissa','VF':'Vetrata fissa','S':'Scorrevole'};
var TIPO_ORD  = ['I','F','PF','FF','VF','S'];
var SCHERM_DESC = {'A':'Avvolgibile man.','AM':'Avv. meccanico','AE':'Avv. elettronico','AR':'Avv. radio','S':'Scuretto','TZ':'Tenda ZIP','TM':'Tenda manuale','CA':'Frangisole cavo','CT':'Frangisole catena'};

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function v(x){return(!x&&x!==0)?'':String(x);}
function n2(x){return Math.round(x*100)/100;}
function cUp(x){return Math.ceil(x);}
function fmtH(x){if(!x&&x!==0)return'—';var r=Math.round(x*1000)/1000;return r.toFixed(3).replace(/0+$/,'').replace(/\.$/,'')||'0';}
// C116 — accetta boolean true, stringa 'true', stringa 'SI'
function isYes(val){return val===true||val==='SI'||val==='true';}

var C={sfrido:50,pvcB:6000,legB:3500,aluB:6000,angLato:50,angB:6000,cassIngr:200,
  sch:{'A':{h:150,sx:30,dx:30,min:1.5},'AM':{h:150,sx:30,dx:30,min:1.5},'AE':{h:150,sx:30,dx:30,min:1.5},'AR':{h:150,sx:30,dx:30,min:1.5},
       'S':{h:0,sx:0,dx:0,min:0},'TZ':{h:100,sx:30,dx:30,min:0},'TM':{h:100,sx:30,dx:30,min:0},
       'CA':{h:250,sx:30,dx:30,min:0},'CT':{h:350,sx:30,dx:30,min:0}},
  zan:{'V':{h:50,sx:50,dx:50,min:1.5},'O':{h:50,sx:50,dx:50,min:2.0}}};

function numPos(p){return p.numero_pos_alfa||p.numero_pos;}
function parseQ(raw){try{var a=typeof raw==='string'?JSON.parse(raw):raw;if(Array.isArray(a))return a.filter(function(q){return q&&q.lettera;});if(typeof a==='object')return Object.keys(a).map(function(k){return{lettera:k,mm:a[k]};});}catch(e){}return[];}

function calcTub(p,db){
  var H=parseFloat(p.H_mm||p.h_mm)||0,L=parseFloat(p.L_mm||p.l_mm)||0;
  var tf=(p.tipo_foro||'').toUpperCase(),ts=(p.tipo_serramento||'').toUpperCase();
  if(!H||!L||!tf) return null;
  var Lt=0,Ht=0,na=0,al=0;
  var inclBasso=(ts==='F'||ts==='FF'),nH=inclBasso?2:1;
  if(p.telaio_misto===true||p.telaio_misto==='true'){
    function getRm(sigla){if(!sigla)return null;for(var i=0;i<db.length;i++){var d=db[i];if(d&&d.materiale===p.materiale&&(d.descrizione===p.sistema||d.sistema===p.sistema)&&d.stile_design===p.stile_design&&d.variante_telaio===sigla)return d;}return null;}
    var rA=getRm(p.variante_alto),rB=getRm(p.variante_basso),rS=getRm(p.variante_sx),rD=getRm(p.variante_dx);
    var nA=rA?(parseFloat(rA.telaio_nascosto_mm)||0):0,aA=rA?(parseFloat(rA.aletta_mm)||0):0,aB=rB?(parseFloat(rB.aletta_mm)||0):0;
    var nS=rS?(parseFloat(rS.telaio_nascosto_mm)||0):0,aS=rS?(parseFloat(rS.aletta_mm)||0):0;
    var nD=rD?(parseFloat(rD.telaio_nascosto_mm)||0):0,aD=rD?(parseFloat(rD.aletta_mm)||0):0;
    var tvA=rA?(parseFloat(rA.telaio_vista_mm)||0):0,tvS=rS?(parseFloat(rS.telaio_vista_mm)||0):0,tvD=rD?(parseFloat(rD.telaio_vista_mm)||0):0;
    if(tf==='A'){Lt=L+nS+nD+aS+aD;Ht=H+nA+aA+(inclBasso?aB:0);}
    else if(tf==='D'){Lt=L+aS+aD;Ht=H+aA+(inclBasso?aB:0);}
    else if(tf==='P'){Lt=L-tvS-tvD+aS+aD;Ht=H-tvA+aA+(inclBasso?aB:0);}
    na=(nA+nS+nD)/3;al=(aA+aB+aS+aD)/4;
  } else {
    var r=null;
    for(var i=0;i<db.length;i++){var d=db[i];if(d&&d.materiale===p.materiale&&(d.descrizione===p.sistema||d.sistema===p.sistema)&&d.stile_design===p.stile_design&&d.variante_telaio===p.variante_telaio){r=d;break;}}
    if(!r){for(var i=0;i<db.length;i++){var d=db[i];if(d&&d.materiale===p.materiale&&(d.descrizione===p.sistema||d.sistema===p.sistema)&&d.stile_design===p.stile_design){r=d;break;}}}
    na=r?(parseFloat(r.telaio_nascosto_mm)||0):0;al=r?(parseFloat(r.aletta_mm)||0):0;
    var tv=r?(parseFloat(r.telaio_vista_mm)||0):0;
    if(tf==='A'){Lt=L+2*na+2*al;Ht=H+na+nH*al;}
    else if(tf==='D'){Lt=L+2*al;Ht=H+nH*al;}
    else if(tf==='P'){Lt=L-2*tv+2*al;Ht=H-tv+nH*al;}
  }
  return {Lt:Lt,Ht:Ht,na:na,al:al};
}

    var ctm={};posCalc.forEach(function(p){if(p.controtelaio!=='T')return;var t=p.tipo_serramento||'?';if(!ctm[t])ctm[t]={n:0,pos:[]};ctm[t].n++;ctm[t].pos.push(numPos(p));});
    if(Object.keys(ctm).length){var tn3=0;Object.values(ctm).forEach(function(vv){tn3+=vv.n;});var ctk=TIPO_ORD.filter(function(t){return ctm[t];});h+=mkG('Termocassa','img/Termocassa.jpeg',tn3+' pz TOT.',ctk.map(function(t){var vv=ctm[t];return{l:TIPO_DESC[t]||t,chips:'<span class="chip-n">'+vv.n+' pz</span>',pos:vv.pos};}));}
    var csm={};posCalc.forEach(function(p){if(!p.cassonetto)return;var k=p.cassonetto;if(!csm[k])csm[k]={m:0,pos:[]};csm[k].m+=p._cassM;csm[k].pos.push(numPos(p));});
    if(Object.keys(csm).length){var tm2=0;Object.values(csm).forEach(function(vv){tm2+=vv.m;});var csd={'P':'PVC','L':'Legno'};h+=mkG('Cassonetto','img/Cassonetto_PVC.webp',n2(tm2)+' m TOT.',Object.keys(csm).map(function(k){var vv=csm[k];return{l:'Cassonetto '+(csd[k]||k),chips:'<span class="chip-m">'+n2(vv.m)+' m</span>',pos:vv.pos};}));}
    var znm={};posCalc.forEach(function(p){if(!p.zanzariera)return;var k=p.zanzariera;if(!znm[k])znm[k]={mq:0,n:0,pos:[]};znm[k].mq+=p._sz;znm[k].n++;znm[k].pos.push(numPos(p));});
    if(Object.keys(znm).length){var tm3=0;Object.values(znm).forEach(function(vv){tm3+=vv.mq;});var znd={'V':'Verticale','O':'Orizzontale'};h+=mkG('Zanzariera','img/Zanzariera.jpeg',n2(tm3)+' mq TOT.',Object.keys(znm).map(function(k){var vv=znm[k];return{l:znd[k]||k,chips:'<span class="chip-mq">'+n2(vv.mq)+' mq</span> <span class="chip-n">'+vv.n+' pz</span>',pos:vv.pos};}));}
    var dim={};var dnord=['DA','I3','I4'];var dnd={'DA':'Davanzale','I3':'Imbotte 3 lati','I4':'Imbotte 4 lati'};
    posCalc.forEach(function(p){if(!p.dinoxill)return;var k=p.dinoxill;if(!dim[k])dim[k]={n:0,pos:[]};dim[k].n++;dim[k].pos.push(numPos(p));});
    if(Object.keys(dim).length){var dn=0;Object.values(dim).forEach(function(vv){dn+=vv.n;});var dik=dnord.filter(function(k){return dim[k];});h+=mkG('Dinoxill','',dn+' pz TOT.',dik.map(function(k){var vv=dim[k];return{l:dnd[k]||k,chips:'<span class="chip-n">'+vv.n+' pz</span>',pos:vv.pos};}));}
    var agp=posCalc.filter(function(p){return p.angolari_pvc===true;});
    if(agp.length){var ab=0;agp.forEach(function(p){if(p._t){var sv=svCop(p._ts,p._t.Lt,p._t.Ht,C.angLato);ab+=cUp(sv/C.angB);}});h+=mkG('Angolari PVC','',agp.length+' pos.',[{l:'Angolari PVC 50mm',chips:'<span class="chip-n">'+agp.length+' pos.</span> <span class="chip-n">'+ab+' barre</span>',pos:agp.map(numPos)}]);}
    var rs=posCalc.filter(function(p){return p.rimozione==='SI'||p.rimozione===true;});
    var ra=posCalc.filter(function(p){return p.rimozione_accessori===true;});
    var mr=posCalc.filter(function(p){return p.taglio_marmo===true;});
    if(rs.length||ra.length||mr.length){var sr=[];if(rs.length)sr.push({l:'Rimozione serramento',chips:'<span class="chip-n">'+rs.length+' pz</span>',pos:rs.map(numPos)});if(ra.length)sr.push({l:'Rimozione accessori',chips:'<span class="chip-n">'+ra.length+' pz</span>',pos:ra.map(numPos)});if(mr.length)sr.push({l:'Taglio marmo',chips:'<span class="chip-n">'+mr.length+' pz</span>',pos:mr.map(numPos)});h+=mkG('Rimozione / Taglio','',(rs.length+ra.length+mr.length)+' interventi',sr);}
    var tS=0,tPol=0,tBG=0,tMu=0,tBV=0,tVi=0;posCalc.forEach(function(p){tS+=p._sch;tPol+=p._mp;tBG+=p._bg;tMu+=p._mu;tBV+=p._bv;tVi+=p._vi;});var tLin=n2(tS+tBG+tMu+tBV);
    h+='<div class="acc-g"><div class="acc-gh"><img class="acc-gimg" src="img/Posa.jpeg" alt="" onerror="this.style.display=\'none\'"><div class="acc-gtit">Materiali di posa</div><div class="acc-gtot">Lineare: '+tLin+' m</div></div><div class="acc-gb"><div class="mat-grid">';
    [{n:'Schiuma',v:n2(tS),u:'m'},{n:'MS Polimero',v:tPol,u:'flac.'},{n:'Nastro BG1',v:n2(tBG),u:'m'},{n:'Nastro Multi',v:n2(tMu),u:'m'},{n:'Bar.vapore',v:n2(tBV),u:'m'},{n:'Viti 1 kit',v:tVi,u:'kit'},{n:'Tot.lineare',v:tLin,u:'m'}].forEach(function(item){h+='<div class="mat-c"><div class="mn">'+item.n+'</div><div class="mv">'+item.v+'</div><div class="mu">'+item.u+'</div></div>';});
    h+='</div></div></div>';
    return h;
  }

  function renderAccSubtot(titolo,pc){
    var nCI=0,nCE=0,nAvv=0,nScur=0,nCtlL=0,nCtlT=0,tLin=0;
    pc.forEach(function(p){if(p._bci)nCI+=p._bci;if(p._bce)nCE+=p._bce;var sc=(p.schermatura||'').toUpperCase();if(sc==='A'||sc==='AM'||sc==='AE'||sc==='AR')nAvv++;else if(sc==='S')nScur++;if(p.controtelaio==='L')nCtlL++;else if(p.controtelaio==='T')nCtlT++;tLin+=p._sch+p._bg+p._mu+p._bv;});
    var cs=function(vv,l){return vv?'<span style="background:#c7d2fe;color:#1e1b4b;border-radius:8px;padding:1px 7px;font-size:9px;font-weight:600;">'+l+': '+vv+'</span> ':'';};
    return '<div style="background:#eef2ff;border:1px solid #c7d2fe;border-radius:6px;padding:6px 12px;margin:4px 0 14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;">'+
      '<span style="font-weight:700;color:#3730a3;font-size:.78rem;">Subtotale '+esc(titolo)+'</span>'+
      cs(nCI,'CopI')+cs(nCE,'CopE')+cs(nAvv,'Avv')+cs(nScur,'Scur')+cs(nCtlL,'CTL-L')+cs(nCtlT,'TC')+
      '<span style="background:#c7d2fe;color:#1e1b4b;border-radius:8px;padding:1px 7px;font-size:9px;font-weight:600;">Posa: '+n2(tLin)+' m</span></div>';
  }

  // ── SEZIONE POSA ──
  if(wP){
    var h='';
    h+=mkHdr('Report Posa');
    var POSA_MODE=loadMode(), adj=loadAdj();
    var ct={I:0,F:0,PF:0,FF:0,VF:0,S:0};
    pos.forEach(function(p){var t=(p.tipo_serramento||'').toUpperCase();if(ct[t]!==undefined)ct[t]++;});
    h+='<div class="tipo-grid-c"><span style="font-size:10px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.4px;margin-right:4px;">Posizioni:</span>';
    TIPO_ORD.forEach(function(s){var n=ct[s]||0;h+='<span class="tipo-chip-c'+(n===0?' zero':'')+'" title="'+(TIPO_DESC[s]||s)+'"><span class="sig">'+s+'</span><span class="cnt">'+n+'</span></span>';});
    h+='</div>';

    if(caps&&caps.length){
      var gruppiPosa=groupByCap(posCalc,caps);
      var totalVoceCalc={};
      // C114 — calcolaVoci riceve USE_GRU per calcolo totalVoceCalc
      gruppiPosa.forEach(function(g){var vG=calcolaVoci(g.pos,USE_GRU);vG.forEach(function(vo){totalVoceCalc[vo.id]=(totalVoceCalc[vo.id]||0)+vo.oreCalc;});});
      gruppiPosa.forEach(function(g){
        if(!g.pos.length)return;
        // C114 — calcolaVoci riceve USE_GRU per il render per capitolo
        var vG=calcolaVoci(g.pos,USE_GRU),capId=g.cap.id||'__fuori__',adjCap=loadAdjCap(capId);
        var tG=0,oDG=0,oIG=0;
        vG.forEach(function(vo){
          var fin;
          if(POSA_MODE==='cap'){var m=parseFloat((adjCap[vo.id]||{}).minus)||0,pl=parseFloat((adjCap[vo.id]||{}).plus)||0;fin=Math.max(0,Math.round((vo.oreCalc-m+pl)*1000)/1000);}
          else{var totV=totalVoceCalc[vo.id]||0,prop=totV>0?vo.oreCalc/totV:0;fin=Math.max(0,Math.round((vo.oreCalc-((adj[vo.id]||{}).minus||0)*prop+((adj[vo.id]||{}).plus||0)*prop)*1000)/1000);}
          tG+=fin;if(vo.tipo==='dir')oDG+=fin;else oIG+=fin;
        });
        tG=Math.round(tG*1000)/1000;
        h+='<div style="background:#1a1a2e;color:#a5b4fc;font-weight:700;font-size:.82rem;padding:6px 12px;margin:10px 0 6px;border-radius:5px;">\u2550\u2550 '+esc(g.cap.titolo)+' \u2550\u2550 <span style="opacity:.7;font-size:.74rem;">('+g.pos.length+' pos.)</span></div>';
        var lA2='',tbG='';
        vG.forEach(function(vo){
          var fin;
          if(POSA_MODE==='cap'){var m=parseFloat((adjCap[vo.id]||{}).minus)||0,pl=parseFloat((adjCap[vo.id]||{}).plus)||0;fin=Math.max(0,Math.round((vo.oreCalc-m+pl)*1000)/1000);}
          else{var totV=totalVoceCalc[vo.id]||0,prop=totV>0?vo.oreCalc/totV:0;fin=Math.max(0,Math.round((vo.oreCalc-((adj[vo.id]||{}).minus||0)*prop+((adj[vo.id]||{}).plus||0)*prop)*1000)/1000);}
          if(vo.n===0&&fin===0)return;
          if(vo.area!==lA2){tbG+='<tr class="tr-sez"><td colspan="6">'+vo.area+'</td></tr>';lA2=vo.area;}
          tbG+='<tr class="tr-voce"><td>'+vo.area+'</td><td>'+vo.serv+'</td><td class="c">'+(vo.n>0?vo.n:'—')+'</td><td class="c">'+(vo.dp?fmtH(vo.dp[0]):'—')+'</td><td class="c">'+((vo.dp&&vo.dp[1])?fmtH(vo.dp[1]):'—')+'</td><td class="ore-f">'+fmtH(fin)+'</td></tr>';
        });
        h+='<div class="tbl-outer"><table class="t-posa"><thead><tr><th style="width:20%">Area</th><th style="width:36%">Servizio</th><th class="c">N</th><th class="c">h/pos</th><th class="c">Min.cant.</th><th class="c">Ore</th></tr></thead><tbody>'+tbG+'</tbody><tfoot><tr class="tr-tot"><td colspan="5">TOTALE '+esc(g.cap.titolo)+'</td><td class="ore-f">'+fmtH(tG)+'</td></tr></tfoot></table></div>';
        var giG=tG>0?Math.ceil(tG/16*10)/10:0;
        h+='<div style="background:#eef2ff;border:1px solid #c7d2fe;border-radius:6px;padding:6px 12px;margin:4px 0 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.78rem;"><span style="font-weight:700;color:#3730a3;">Subtotale '+esc(g.cap.titolo)+'</span><span style="background:#c7d2fe;color:#1e1b4b;border-radius:8px;padding:1px 8px;font-weight:600;">Dir: '+fmtH(oDG)+'</span><span style="background:#c7d2fe;color:#1e1b4b;border-radius:8px;padding:1px 8px;font-weight:600;">Ind: '+fmtH(oIG)+'</span><span style="background:#c7d2fe;color:#1e1b4b;border-radius:8px;padding:1px 8px;font-weight:600;">Tot: '+fmtH(tG)+'</span><span style="background:#c7d2fe;color:#1e1b4b;border-radius:8px;padding:1px 8px;font-weight:600;">Giorni: '+giG+'</span></div>';
      });
      h+='<div style="background:#064e3b;color:#a7f3d0;font-weight:700;font-size:.82rem;padding:6px 12px;margin:14px 0 6px;border-radius:5px;">\u2211 Totali complessivi</div>';
    }

    // C114 — calcolaVoci totale complessivo riceve USE_GRU
    var voci=calcolaVoci(pos,USE_GRU);
    var totCalc=0,totFin=0,areaMap={};
    var tbH='',lastArea='';
    var globaleFin={};
    if(POSA_MODE==='cap'&&caps&&caps.length){
      var gruppiPosaG=groupByCap(posCalc,caps);
      gruppiPosaG.forEach(function(g){
        if(!g.pos.length)return;
        // C114 — calcolaVoci per globaleFin riceve USE_GRU
        var capId=g.cap.id||'__fuori__',adjCap=loadAdjCap(capId),vG=calcolaVoci(g.pos,USE_GRU);
        vG.forEach(function(vo){var m=parseFloat((adjCap[vo.id]||{}).minus)||0,pl=parseFloat((adjCap[vo.id]||{}).plus)||0;var fin=Math.max(0,Math.round((vo.oreCalc-m+pl)*1000)/1000);globaleFin[vo.id]=(globaleFin[vo.id]||0)+fin;});
      });
    }
    voci.forEach(function(vo){
      if(vo.area!==lastArea){tbH+='<tr class="tr-sez"><td colspan="6">'+vo.area+'</td></tr>';lastArea=vo.area;}
      var fin;
      if(POSA_MODE==='cap'&&caps&&caps.length){fin=Math.round((globaleFin[vo.id]||0)*1000)/1000;}
      else{var minus=parseFloat((adj[vo.id]||{}).minus)||0,plus=parseFloat((adj[vo.id]||{}).plus)||0;fin=Math.max(0,Math.round((vo.oreCalc-minus+plus)*1000)/1000);}
      totCalc+=vo.oreCalc;totFin+=fin;
      if(!areaMap[vo.area])areaMap[vo.area]={fin:0,tipo:vo.tipo};areaMap[vo.area].fin+=fin;
      var isZero=vo.n===0&&vo.oreCalc===0&&fin===0;
      tbH+='<tr class="tr-voce'+(isZero?' zero-row':'')+'"><td>'+vo.area+'</td><td>'+vo.serv+'</td><td class="c">'+(vo.n>0?String(vo.n):'—')+'</td><td class="c">'+(vo.dp?fmtH(vo.dp[0]):'—')+'</td><td class="c">'+((vo.dp&&vo.dp[1])?fmtH(vo.dp[1]):'—')+'</td><td class="ore-f">'+fmtH(fin)+'</td></tr>';
    });
    h+='<div class="tbl-outer"><table class="t-posa"><thead><tr><th style="width:20%">Area</th><th style="width:36%">Servizio</th><th class="c">N</th><th class="c">h/pos</th><th class="c">Min.cant.</th><th class="c">Ore</th></tr></thead><tbody>'+tbH+'</tbody><tfoot><tr class="tr-tot"><td colspan="5">TOTALE</td><td class="ore-f">'+fmtH(totFin)+'</td></tr></tfoot></table></div>';
    var oreDir=0,oreInd=0,aHtml='';
    Object.keys(areaMap).forEach(function(area){var d=areaMap[area];aHtml+='<div class="sum-row"><span class="lbl">'+area+'</span><span class="val">'+fmtH(d.fin)+'</span></div>';if(d.tipo==='dir')oreDir+=d.fin;else oreInd+=d.fin;});
    aHtml+='<div class="sum-row tot"><span class="lbl">TOTALE</span><span class="val">'+fmtH(totFin)+'</span></div>';
    var oreHtml='<div class="sum-row"><span class="lbl">Ore Dirette</span><span class="val">'+fmtH(oreDir)+'</span></div><div class="sum-row"><span class="lbl">Ore Indirette</span><span class="val">'+fmtH(oreInd)+'</span></div><div class="sum-row tot"><span class="lbl">Dirette+Indirette</span><span class="val">'+fmtH(oreDir+oreInd)+'</span></div><div class="sum-row tot"><span class="lbl">Ore Totali</span><span class="val">'+fmtH(totFin)+'</span></div>';
    var orePrev=0;voci.forEach(function(vo){if(vo.id==='prog'){if(POSA_MODE==='cap'&&caps&&caps.length){orePrev=Math.round((globaleFin['prog']||0)*1000)/1000;}else{var m=parseFloat((adj[vo.id]||{}).minus)||0,pl=parseFloat((adj[vo.id]||{}).plus)||0;orePrev=Math.max(0,Math.round((vo.oreCalc-m+pl)*1000)/1000);}}});
    h+='<div class="posa-bottom"><div class="sum-block"><h3>Riepilogo per area</h3>'+aHtml+'</div><div class="sum-block"><h3>Riepilogo ore</h3>'+oreHtml+'</div></div>';
    h+='<div class="ore-grid-c">';
    [{l:'Ore Dirette',v:fmtH(oreDir)},{l:'Ore Indirette',v:fmtH(oreInd)},{l:'Dirette+Indirette',v:fmtH(oreDir+oreInd)},{l:'Ore Totali',v:fmtH(totFin)},{l:'Ore Preventivo',v:fmtH(orePrev)}].forEach(function(item){h+='<div class="ore-card-c"><div class="ov">'+item.v+'</div><div class="ol">'+item.l+'</div></div>';});
    h+='</div>';
    sections.push(h);
  }

  return sections.map(function(s,i){var isLast=(i===sections.length-1);return '<div class="sezione'+(isLast?'':' sezione-break')+'">'+s+'</div>';}).join('');
}
</script>
