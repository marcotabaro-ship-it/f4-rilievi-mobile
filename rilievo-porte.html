<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <title>Rilievo Porte — F4 Rilievi</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/mobile.css"/>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#1a1a2e"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <style>
    .pos-row { display:flex; align-items:center; gap:10px; padding:11px 14px; border-top:1px solid var(--c-border); cursor:pointer; -webkit-tap-highlight-color:transparent; }
    .pos-row:active { background:var(--c-bg); }
    .pos-num { width:34px; height:34px; border-radius:8px; background:var(--c-orange); color:#fff; font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .pos-body { flex:1; min-width:0; }
    .pos-tipo { font-size:11px; font-weight:700; color:var(--c-orange); }
    .pos-dim  { font-size:13px; font-weight:600; color:var(--c-text); }
    .pos-sis  { font-size:11px; color:var(--c-text-sec); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
    .pos-acc  { display:flex; flex-wrap:wrap; gap:3px; margin-top:4px; }
    .pos-azioni { display:flex; flex-direction:column; gap:4px; flex-shrink:0; }
    .pos-btn-copia, .pos-btn-elim { display:flex; align-items:center; justify-content:center; width:44px; height:44px; border:none; border-radius:8px; cursor:pointer; font-size:17px; line-height:1; padding:0; -webkit-tap-highlight-color:transparent; }
    .pos-btn-copia { background:#e0f2fe; color:#0369a1; }
    .pos-btn-copia:active { background:#bae6fd; }
    .pos-btn-elim  { background:#fee2e2; color:#dc2626; }
    .pos-btn-elim:active  { background:#fecaca; }
    .cap-hdr  { background:var(--c-primary); color:#fcd34d; font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; padding:7px 14px; display:flex; align-items:center; justify-content:space-between; }
    .cap-sub  { background:#fff7ed; border-bottom:2px solid #fed7aa; padding:5px 14px; font-size:11px; color:#c2410c; font-weight:600; }
    .det-sec  { margin-bottom:16px; }
    .det-sec-title { font-size:10px; font-weight:700; color:var(--c-orange); text-transform:uppercase; letter-spacing:.5px; border-bottom:2px solid var(--c-border); padding-bottom:4px; margin-bottom:10px; }
    .det-row  { display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid #f5f5ff; font-size:13px; }
    .det-row:last-child { border-bottom:none; }
    .det-lbl  { color:var(--c-text-sec); font-size:12px; }
    .det-val  { font-weight:600; color:var(--c-text); text-align:right; max-width:60%; }
    .btn-del-sheet { flex:0 0 auto; padding:14px 16px; background:#fee2e2; color:#dc2626; border:2px solid #fca5a5; border-radius:10px; font-size:18px; font-weight:700; cursor:pointer; font-family:inherit; line-height:1; }
    .btn-del-sheet:active { background:#fecaca; }

    /* ── C133/C128 — Barra navigazione report porte ── */
    .report-nav { display:flex; gap:8px; padding:10px 14px 8px; overflow-x:auto; -webkit-overflow-scrolling:touch; background:var(--c-surface,#fff); border-bottom:1px solid var(--c-border,#e5e7eb); }
    .report-nav::-webkit-scrollbar { display:none; }
    .report-nav-btn { flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 14px; background:#fff7ed; border:1.5px solid #fed7aa; border-radius:10px; cursor:pointer; font-family:inherit; -webkit-tap-highlight-color:transparent; text-decoration:none; }
    .report-nav-btn:active { background:#ffedd5; border-color:#fb923c; }
    .report-nav-btn .rn-ico { font-size:18px; line-height:1; }
    .report-nav-btn .rn-lbl { font-size:10px; font-weight:700; color:#c2410c; white-space:nowrap; }
  </style>
</head>
<body>

<div class="top-bar" style="background:#7c2d12;">
  <button class="top-bar-btn" onclick="history.back()">&#8592;</button>
  <div style="flex:1;min-width:0;">
    <div class="top-bar-title" id="tbCodice">Rilievo Porte</div>
    <div style="font-size:11px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" id="tbSub">—</div>
  </div>
  <div class="top-bar-actions">
    <button class="top-bar-btn" onclick="apriCapitoli()" title="Capitoli" style="font-size:15px;">&#128218;</button>
    <button class="top-bar-btn" onclick="apriModificaRilievo()" title="Modifica rilievo" style="font-size:16px;">&#9998;</button>
    <div class="top-bar-online" id="onlineIndicator"></div>
    <div class="top-bar-avatar" id="userAvatar">TM</div>
  </div>
</div>

<div style="position:fixed;top:56px;bottom:0;left:0;right:0;overflow-y:auto;-webkit-overflow-scrolling:touch;" id="mainWrap">

  <div id="cardRilievo" style="background:#7c2d12;color:#fff;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;">
    <div style="flex:1;">
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;" id="rilBadges"></div>
      <div style="font-size:12px;opacity:.7;" id="rilInfo">—</div>
    </div>
    <div style="background:rgba(255,255,255,.15);border-radius:8px;padding:6px 10px;text-align:center;flex-shrink:0;">
      <div style="font-size:18px;font-weight:700;" id="rilNPosN">—</div>
      <div style="font-size:10px;opacity:.7;">pos.</div>
    </div>
  </div>

  <!-- ── C133/C128 — Navigazione report porte ── -->
  <div class="report-nav">
    <button class="report-nav-btn" onclick="window.location.href='report_rilievo_porte.html?id='+idRilievo">
      <span class="rn-ico">&#128196;</span>
      <span class="rn-lbl">Report rilievo porte</span>
    </button>
    <button class="report-nav-btn" onclick="window.location.href='report_posa_porte.html?id='+idRilievo">
      <span class="rn-ico">&#9201;</span>
      <span class="rn-lbl">Report posa porte</span>
    </button>
    <button class="report-nav-btn" onclick="window.location.href='stampa_combinata_porte.html?id='+idRilievo">
      <span class="rn-ico">&#128438;</span>
      <span class="rn-lbl">Stampa combinata porte</span>
    </button>
  </div>
  <!-- ── fine navigazione report porte ── -->

  <div class="filter-row" style="padding:10px 14px 6px;margin-bottom:0;">
    <button class="filter-chip active" onclick="setFiltro('tutti',this)">Tutti</button>
    <button class="filter-chip orange" onclick="setFiltro('INT',this)">INT</button>
    <button class="filter-chip orange" onclick="setFiltro('BLI',this)">BLI</button>
    <button class="filter-chip orange" onclick="setFiltro('REI',this)">REI</button>
  </div>

  <div id="listaPosizioni" style="padding-bottom:24px;">
    <div class="loading-state"><div class="spinner"></div><p>Caricamento...</p></div>
  </div>
</div>

<div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet()"></div>
<div class="bottom-sheet" id="sheetPos">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <div class="sheet-title" id="shTitle">Posizione —</div>
    <button class="sheet-close" onclick="closeSheet()">&#10005;</button>
  </div>
  <div class="sheet-body" id="shBody"></div>
  <div class="sheet-footer" style="display:flex;gap:10px;">
    <button class="btn-del-sheet" onclick="eliminaPosizione()" title="Elimina posizione">&#128465;</button>
    <button class="btn btn-orange btn-full" id="btnModifica" onclick="modificaPosizione()">&#9998; Modifica posizione</button>
  </div>
</div>

<button class="btn-fab" id="fabNuova" onclick="nuovaPosizione()" title="Nuova posizione" style="display:none;background:var(--c-orange);">&#43;</button>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/db-local.js"></script>
<script src="js/api-mobile.js"></script>
<script>
var currentUser = Auth.requireLogin();
if (!currentUser) throw new Error('not logged');
document.getElementById('userAvatar').textContent = currentUser.sigla || (currentUser.nome||'U').substring(0,2).toUpperCase();
document.getElementById('onlineIndicator').className = 'top-bar-online' + (API.isOnline()?'':' offline');

var idRilievo = new URLSearchParams(window.location.search).get('id');
if (!idRilievo) { history.back(); }

var _rilievo=null, _posizioni=[], _capitoli=[], _dbPorte=[], _filtro='tutti';

function calcDimPorta(p, dbPorte) {
  var H=parseFloat(p.H_mm||p.h_mm)||0, L=parseFloat(p.L_mm||p.l_mm)||0;
  var tf=(p.tipo_foro||'').toUpperCase();
  if (!H||!L) return null;
  if (tf==='N') return {Lt:Math.round(L), Ht:Math.round(H)};
  if (tf==='P') {
    var rec=null;
    for(var i=0;i<dbPorte.length;i++){var d=dbPorte[i];if(d&&d.fornitore===p.fornitore&&(d.descrizione===p.sistema||d.sistema===p.sistema)){rec=d;break;}}
    var offL=rec?(parseFloat(rec.offset_larghezza_mm)||0):0;
    var offH=rec?(parseFloat(rec.offset_altezza_mm)||0):0;
    return {Lt:Math.round(L+offL), Ht:Math.round(H+offH)};
  }
  return {Lt:Math.round(L), Ht:Math.round(H)};
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function v(x){ return (x===null||x===undefined)?'':String(x); }

// ── C131/C132 FIX: accetta boolean true, stringa 'true' e stringa 'SI' ──
function isYes(val){ return val===true || val==='SI' || val==='true'; }

function load() {
  DBLocal.getById('rilievi', idRilievo, function(ril) {
    if (!ril) {
      document.getElementById('listaPosizioni').innerHTML='<div class="empty-state"><div class="empty-ico">&#128682;</div><div class="empty-title">Rilievo non trovato</div><div class="empty-sub">Esegui una sincronizzazione</div></div>';
      return;
    }
    _rilievo = ril;
    document.title = (ril.codice_completo||'Rilievo Porte') + ' — F4 Rilievi';
    document.getElementById('tbCodice').textContent = ril.codice_completo || ril.id.substring(0,8);

    DBLocal.getAll('cantieri', function(ca){
      var cant = ca.find(function(c){ return c.id===ril.id_cantiere; });
      DBLocal.getAll('clienti', function(cl){
        var cli = cant ? cl.find(function(c){ return c.id===cant.id_cliente; }) : null;
        var sub = '';
        if (cli) sub += cli.nome;
        if (cant) sub += (sub?' — ':'')+cant.nome_cantiere;
        document.getElementById('tbSub').textContent = sub || '—';

        var badges = '';
        if (ril.intervento) badges += '<span style="background:rgba(255,255,255,.15);color:#fff;font-size:10px;padding:2px 8px;border-radius:10px;">'+esc(ril.intervento)+'</span>';
        document.getElementById('rilBadges').innerHTML = badges;

        var info = [];
        if (ril.referente) info.push('Ref: '+ril.referente);
        if (ril.data_rilievo) info.push(ril.data_rilievo);
        if (ril.data_posa) info.push('Posa: '+ril.data_posa);
        document.getElementById('rilInfo').textContent = info.join(' · ');

        DBLocal.getAll('posizioni_porte', function(pos){
          _posizioni = pos.filter(function(p){ return p.id_rilievo===idRilievo && p.stato==='attivo'; });
          document.getElementById('rilNPosN').textContent = _posizioni.length;
          DBLocal.getAll('capitoli_rilievo', function(cap){
            _capitoli = cap.filter(function(c){ return c.id_rilievo===idRilievo && c.stato==='attivo'; });
            DBLocal.getAll('db_porte', function(db){
              _dbPorte = db||[];
              renderPosizioni();
            });
          });
        });
      });
    });
  });
}

function setFiltro(f, btn) {
  _filtro = f;
  document.querySelectorAll('.filter-chip').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  renderPosizioni();
}

function renderPosizioni() {
  var container = document.getElementById('listaPosizioni');
  var pos = _posizioni.filter(function(p){
    if (_filtro==='tutti') return true;
    return (p.tipo_porta||'').toUpperCase()===_filtro;
  });

  document.getElementById('fabNuova').style.display = '';
  if (!pos.length) {
    container.innerHTML='<div class="empty-state"><div class="empty-ico">&#128682;</div><div class="empty-title">Nessuna posizione</div></div>';
    return;
  }

  var righe = [];
  pos.forEach(function(p){ righe.push({tipo:'pos',ordine:p.ordine!=null?p.ordine:p.numero_pos,data:p}); });
  _capitoli.forEach(function(cap){
    righe.push({tipo:'cap_ini',ordine:cap.ordine_inizio,data:cap});
    righe.push({tipo:'cap_fin',ordine:cap.ordine_fine,data:cap});
  });
  righe.sort(function(a,b){ return a.ordine-b.ordine; });

  var html = '';
  var capCorr=null, posCapCorr=[], posiFuori=[];

  function flushCap() {
    if (!capCorr||!posCapCorr.length) return;
    html += '<div class="cap-sub">Subtotale '+esc(capCorr.titolo)+' &mdash; <b>'+posCapCorr.length+'</b> pos.</div>';
  }

  righe.forEach(function(r){
    if (r.tipo==='cap_ini') {
      if (posiFuori.length) {
        posiFuori.forEach(function(p){ html += renderPosizioneRow(p); });
        posiFuori=[];
      }
      capCorr=r.data; posCapCorr=[];
      html += '<div class="cap-hdr"><span>'+esc(r.data.titolo)+'</span></div>';
      html += '<div class="card" style="margin:0;border-radius:0;">';
      return;
    }
    if (r.tipo==='cap_fin') {
      if (capCorr) { flushCap(); html += '</div>'; }
      capCorr=null; posCapCorr=[];
      return;
    }
    var p=r.data;
    if (capCorr) { posCapCorr.push(p); html += renderPosizioneRow(p); }
    else posiFuori.push(p);
  });

  if (posiFuori.length) {
    html += '<div class="card" style="border-radius:var(--radius);margin:0;">';
    posiFuori.forEach(function(p){ html += renderPosizioneRow(p); });
    html += '</div>';
  }

  container.innerHTML = html;
  document.getElementById('fabNuova').style.display = '';
}

function renderPosizioneRow(p) {
  var dim = calcDimPorta(p, _dbPorte);
  var L=v(p.l_mm||p.L_mm), H=v(p.h_mm||p.H_mm);
  var dimIns = L&&H ? L+' &times; '+H : '—';
  var dimCalc = dim ? Math.round(dim.Lt)+' &times; '+Math.round(dim.Ht) : '';
  var tipoLabel = p.tipo_porta||'?';
  var pianoStr = p.piano!=null ? ('P'+(p.piano>=0?'+':'')+p.piano) : '—';
  var sisStr = [p.fornitore, p.sistema].filter(Boolean).join(' / ') || '—';
  var chips = '';
  // C131 FIX: badge CTL usa isYes() su tutti e 6 i campi
  var hasCTL = isYes(p.fornitura_ctl_int)||isYes(p.fornitura_ctl_bli)||isYes(p.fornitura_ctl_rei)||
               isYes(p.install_ctl_int)||isYes(p.install_ctl_bli)||isYes(p.install_ctl_rei);
  if (hasCTL) chips += '<span class="badge" style="background:#fee2e2;color:#dc2626;font-size:10px;">CTL</span>';
  if (isYes(p.allargamento_telaio)) chips += '<span class="badge" style="background:#fef3c7;color:#92400e;font-size:10px;">Allarg.</span>';
  if (isYes(p.rimozione)) chips += '<span class="badge badge-disattivo" style="font-size:10px;">Rim</span>';
  if (p.sopraluce===true||p.sopraluce==='SI') chips += '<span class="badge" style="background:#e0f2fe;color:#0369a1;font-size:10px;">Sopr.</span>';
  var numDisp = p.numero_pos_alfa || p.numero_pos;
  return '<div class="pos-row" onclick="apriDettaglio(\''+p.id+'\')" data-id="'+p.id+'">'+
    '<div class="pos-num">'+esc(String(numDisp))+'</div>'+
    '<div class="pos-body">'+
      '<div style="display:flex;align-items:baseline;gap:8px;">'+
        '<span class="pos-tipo">'+esc(tipoLabel)+'</span>'+
        '<span style="font-size:10px;color:var(--c-text-ter);">'+pianoStr+'</span>'+
        (p.ambiente?'<span style="font-size:10px;color:var(--c-text-sec);">'+esc(p.ambiente)+'</span>':'')+
      '</div>'+
      '<div style="display:flex;align-items:baseline;gap:8px;">'+
        '<span class="pos-dim">'+dimIns+'</span>'+
        (dimCalc?'<span style="font-size:11px;color:var(--c-orange);font-style:italic;">('+dimCalc+')</span>':'')+
      '</div>'+
      '<div class="pos-sis">'+esc(sisStr)+'</div>'+
      (chips?'<div class="pos-acc">'+chips+'</div>':'')+
    '</div>'+
    '<div class="pos-azioni">'+
      '<button class="pos-btn-copia" title="Copia posizione" onclick="copiaPosizione(\''+p.id+'\',event)">&#128203;</button>'+
      '<button class="pos-btn-elim"  title="Elimina posizione" onclick="eliminaPosizioneRow(\''+p.id+'\',event)">&#128465;</button>'+
    '</div>'+
  '</div>';
}

function apriDettaglio(id) {
  _currentPosId=id;
  var p=_posizioni.find(function(x){return x.id===id;});
  if(!p) return;
  var dim=calcDimPorta(p,_dbPorte);
  var numDisp=p.numero_pos_alfa||p.numero_pos;
  var pianoStr=p.piano!=null?('P'+(p.piano>=0?'+':'')+p.piano):'—';
  document.getElementById('shTitle').textContent='Posizione '+numDisp+' \u2014 '+(p.tipo_porta||'?');

  var html='';

  html+='<div class="det-sec"><div class="det-sec-title">&#128207; Geometria</div>';
  html+='<div class="det-row"><span class="det-lbl">Piano</span><span class="det-val">'+pianoStr+'</span></div>';
  if(p.ambiente) html+='<div class="det-row"><span class="det-lbl">Ambiente</span><span class="det-val">'+esc(p.ambiente)+'</span></div>';
  html+='<div class="det-row"><span class="det-lbl">Tipo foro</span><span class="det-val">'+esc(p.tipo_foro||'—')+'</span></div>';
  html+='<div class="det-row"><span class="det-lbl">L inserita</span><span class="det-val">'+esc(v(p.l_mm||p.L_mm)||'—')+' mm</span></div>';
  html+='<div class="det-row"><span class="det-lbl">H inserita</span><span class="det-val">'+esc(v(p.h_mm||p.H_mm)||'—')+' mm</span></div>';
  if(dim){
    html+='<div class="det-row"><span class="det-lbl">L ordine</span><span class="det-val" style="color:var(--c-orange);font-style:italic;">'+dim.Lt+' mm</span></div>';
    html+='<div class="det-row"><span class="det-lbl">H ordine</span><span class="det-val" style="color:var(--c-orange);font-style:italic;">'+dim.Ht+' mm</span></div>';
  }
  if(p.sp_muro_mm) html+='<div class="det-row"><span class="det-lbl">Sp. muro</span><span class="det-val">'+esc(v(p.sp_muro_mm))+' mm</span></div>';
  if(p.telaio_decentrato_mm) html+='<div class="det-row"><span class="det-lbl">Decentr. telaio</span><span class="det-val">'+esc(v(p.telaio_decentrato_mm))+' mm</span></div>';
  html+='</div>';

  html+='<div class="det-sec"><div class="det-sec-title">&#128682; Porta</div>';
  if(p.fornitore)  html+='<div class="det-row"><span class="det-lbl">Fornitore</span><span class="det-val">'+esc(p.fornitore)+'</span></div>';
  if(p.sistema)    html+='<div class="det-row"><span class="det-lbl">Sistema</span><span class="det-val">'+esc(p.sistema)+'</span></div>';
  if(p.collezione) html+='<div class="det-row"><span class="det-lbl">Collezione</span><span class="det-val">'+esc(p.collezione)+'</span></div>';
  if(p.modello)    html+='<div class="det-row"><span class="det-lbl">Modello</span><span class="det-val">'+esc(p.modello)+'</span></div>';
  if(p.versione_porta) html+='<div class="det-row"><span class="det-lbl">Versione</span><span class="det-val">'+esc(p.versione_porta)+'</span></div>';
  if(p.essenza)    html+='<div class="det-row"><span class="det-lbl">Essenza</span><span class="det-val">'+esc(p.essenza)+'</span></div>';
  if(p.verso_apertura) html+='<div class="det-row"><span class="det-lbl">Verso apertura</span><span class="det-val">'+esc(p.verso_apertura)+'</span></div>';
  if(p.sopraluce===true||p.sopraluce==='SI') html+='<div class="det-row"><span class="det-lbl">Sopraluce</span><span class="det-val">&#9989;</span></div>';
  html+='</div>';

  // C132 FIX: hasCTL usa isYes() su tutti e 6 i campi, accetta boolean true / 'true' / 'SI'
  var hasCTL = isYes(p.fornitura_ctl_int) || isYes(p.fornitura_ctl_bli) || isYes(p.fornitura_ctl_rei) ||
               isYes(p.install_ctl_int)   || isYes(p.install_ctl_bli)   || isYes(p.install_ctl_rei);
  // C132 FIX: hasFlag separato — la sezione si apre se c'è CTL OPPURE un flag strutturale
  var hasFlag = isYes(p.allargamento_telaio) || isYes(p.rimozione);
  if(hasCTL||hasFlag){
    html+='<div class="det-sec"><div class="det-sec-title">&#9881; Installazione e flag</div>';
    // C132 FIX: ogni singolo CTL usa isYes() invece di === 'SI'
    if(isYes(p.fornitura_ctl_int)) html+='<div class="det-row"><span class="det-lbl">Fornitura CTL int.</span><span class="det-val">&#9989;</span></div>';
    if(isYes(p.fornitura_ctl_bli)) html+='<div class="det-row"><span class="det-lbl">Fornitura CTL blindata</span><span class="det-val">&#9989;</span></div>';
    if(isYes(p.fornitura_ctl_rei)) html+='<div class="det-row"><span class="det-lbl">Fornitura CTL REI</span><span class="det-val">&#9989;</span></div>';
    if(isYes(p.install_ctl_int))   html+='<div class="det-row"><span class="det-lbl">Install. CTL int.</span><span class="det-val">&#9989;</span></div>';
    if(isYes(p.install_ctl_bli))   html+='<div class="det-row"><span class="det-lbl">Install. CTL blindata</span><span class="det-val">&#9989;</span></div>';
    if(isYes(p.install_ctl_rei))   html+='<div class="det-row"><span class="det-lbl">Install. CTL REI</span><span class="det-val">&#9989;</span></div>';
    if(isYes(p.allargamento_telaio)){
      html+='<div class="det-row"><span class="det-lbl">Allargamento telaio</span><span class="det-val">&#9989;'+(p.allargamento_mm?' — '+p.allargamento_mm+' mm':'')+'</span></div>';
    }
    if(isYes(p.rimozione)) html+='<div class="det-row"><span class="det-lbl">Rimozione porta</span><span class="det-val">&#9989;</span></div>';
    html+='</div>';
  }

  if(p.tipo_serratura||p.colore_serratura||p.colore_cerniere||p.maniglia_marca||p.vetri===true||p.mostrine===true){
    html+='<div class="det-sec"><div class="det-sec-title">&#128273; Serratura e finiture</div>';
    if(p.tipo_serratura)   html+='<div class="det-row"><span class="det-lbl">Tipo serratura</span><span class="det-val">'+esc(p.tipo_serratura)+'</span></div>';
    if(p.colore_serratura) html+='<div class="det-row"><span class="det-lbl">Colore serratura</span><span class="det-val">'+esc(p.colore_serratura)+'</span></div>';
    if(p.colore_cerniere)  html+='<div class="det-row"><span class="det-lbl">Colore cerniere</span><span class="det-val">'+esc(p.colore_cerniere)+'</span></div>';
    if(p.maniglia_marca)   html+='<div class="det-row"><span class="det-lbl">Maniglia marca</span><span class="det-val">'+esc(p.maniglia_marca)+'</span></div>';
    if(p.maniglia_modello) html+='<div class="det-row"><span class="det-lbl">Maniglia modello</span><span class="det-val">'+esc(p.maniglia_modello)+'</span></div>';
    if(p.maniglia_colore_mat) html+='<div class="det-row"><span class="det-lbl">Maniglia colore/mat.</span><span class="det-val">'+esc(p.maniglia_colore_mat)+'</span></div>';
    if(p.vetri===true)     html+='<div class="det-row"><span class="det-lbl">Vetri</span><span class="det-val">&#9989;</span></div>';
    if(p.mostrine===true)  html+='<div class="det-row"><span class="det-lbl">Mostrine</span><span class="det-val">&#9989;</span></div>';
    html+='</div>';
  }

  if(p.note){
    html+='<div class="det-sec"><div class="det-sec-title">&#128221; Note</div>';
    html+='<div style="font-size:13px;color:var(--c-text);line-height:1.5;background:var(--c-bg);border-radius:8px;padding:10px 12px;">'+esc(p.note)+'</div>';
    html+='</div>';
  }

  document.getElementById('shBody').innerHTML=html;
  document.getElementById('sheetOverlay').className='sheet-overlay visible';
  document.getElementById('sheetPos').className='bottom-sheet open';
}

// ── FASE 5C — COPIA POSIZIONE DA RIGA ──────────────────────────────────────
// Chiede quante copie creare (1-10), poi chiama _eseguiCopia.
// event.stopPropagation() impedisce l'apertura del bottom sheet.
function copiaPosizione(id, event) {
  event.stopPropagation();
  var input = prompt('Quante copie creare? (1\u201310)', '1');
  if (input === null) return;
  // Validazione stretta: solo interi puri, no decimali, no testo aggiuntivo
  if (!/^\d+$/.test(input.trim())) { alert('Inserire un numero intero da 1 a 10.'); return; }
  var n = parseInt(input.trim(), 10);
  if (n < 1 || n > 10) { alert('Inserire un numero intero da 1 a 10.'); return; }
  _eseguiCopia(id, n);
}

// Esegue N copie sequenziali della posizione sorgente identificata da id.
// Ogni copia: nuovi numero_pos e ordine, id_capitolo=null, numero_pos_alfa=null, stato attivo.
// Tutti gli altri campi (CTL, sistema, fornitore, ecc.) vengono copiati dalla sorgente.
// Gli INSERT vengono eseguiti in serie: ogni call attende il callback prima di procedere.
// _posizioni viene aggiornato in memoria dopo ogni INSERT per mantenere il contatore corretto.
function _eseguiCopia(id, n) {
  var sorgente = _posizioni.find(function(x) { return x.id === id; });
  if (!sorgente) { alert('Posizione non trovata.'); return; }

  var rimasti = n;
  function prossimaInsert() {
    if (rimasti <= 0) {
      // Aggiorna contatore alto prima del render, coerente con eliminaPosizione/Row
      document.getElementById('rilNPosN').textContent = _posizioni.length;
      renderPosizioni();
      API.miniSync('posizioni_porte', function() {});
      return;
    }
    // Calcola max numero_pos dalle posizioni attive in memoria (include le copie già inserite)
    var maxNP = 0;
    _posizioni.forEach(function(p) { if ((parseInt(p.numero_pos) || 0) > maxNP) maxNP = parseInt(p.numero_pos) || 0; });
    var nuovoNP = maxNP + 1;
    // Compone il payload: copia tutti i campi della sorgente, poi sovrascrive i campi di sistema.
    // I campi porte (CTL, sistema, fornitore, tipo_porta, ecc.) vengono preservati dalla sorgente.
    var payload = Object.assign({}, sorgente);
    delete payload.id;             // Supabase assegna nuovo UUID
    payload.numero_pos      = nuovoNP;
    payload.ordine          = nuovoNP * 10;
    payload.id_capitolo     = null; // la copia nasce fuori da qualsiasi capitolo
    payload.numero_pos_alfa = null;
    payload.stato           = 'attivo';
    delete payload.created_at;
    delete payload.updated_at;

    API.savePosizione('posizioni_porte', 'insert', payload, null, function(err, saved) {
      if (err) { alert('Errore durante la copia: ' + err); return; }
      if (saved) _posizioni.push(saved); // aggiorna memoria per il giro successivo
      rimasti--;
      prossimaInsert();
    });
  }
  prossimaInsert();
}

// ── FASE 5C — ELIMINA POSIZIONE DA RIGA ─────────────────────────────────────
// Stessa logica di eliminaPosizione() da bottom sheet, ma innescata dalla riga.
// event.stopPropagation() impedisce l'apertura del bottom sheet.
function eliminaPosizioneRow(id, event) {
  event.stopPropagation();
  if (!confirm("Eliminare questa posizione? L\u2019operazione non \u00e8 reversibile da mobile.")) return;
  API.writeRecord('update', 'posizioni_porte', {id: id, stato: 'disattivo'}, function(err) {
    if (err) { alert('Errore eliminazione: ' + err); return; }
    _posizioni = _posizioni.filter(function(p) { return p.id !== id; });
    document.getElementById('rilNPosN').textContent = _posizioni.length;
    renderPosizioni();
    API.miniSync('posizioni_porte', function() {});
  });
}
