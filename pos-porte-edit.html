<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <title>Posizione porte — F4 Rilievi</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/mobile.css"/>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#1a1a2e"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <style>
    .fsec{background:var(--c-surface);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;}
    .fsec-hdr{background:#7c2d12;color:#fed7aa;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;padding:8px 14px;display:flex;align-items:center;gap:8px;}
    .fsec-body{padding:14px;}
    .form-row-2m{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .form-group-m{margin-bottom:12px;}
    .form-label-m{display:block;font-size:11px;font-weight:600;color:var(--c-text-sec);margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px;}
    .req{color:var(--c-red);}
    .form-ctrl{width:100%;border:2px solid var(--c-border);border-radius:10px;padding:11px 13px;font-size:15px;font-family:inherit;color:var(--c-text);background:var(--c-surface);outline:none;-webkit-appearance:none;transition:border-color .15s;}
    .form-ctrl:focus{border-color:var(--c-orange);}
    .form-ctrl:disabled{background:var(--c-bg);color:var(--c-text-sec);}
    .chk-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--c-border);cursor:pointer;}
    .chk-row:last-child{border-bottom:none;}
    .chk-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--c-orange);flex-shrink:0;}
    .chk-row label{font-size:14px;color:var(--c-text);cursor:pointer;flex:1;}
    .calc-strip{background:#fff7ed;border:1px solid #fdba74;border-radius:10px;padding:10px 14px;margin-bottom:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
    .calc-lbl{font-size:11px;color:var(--c-text-sec);}
    .calc-val{font-size:14px;font-weight:700;color:var(--c-orange);}
    .conflict-banner{background:#fee2e2;border:1px solid #fca5a5;border-radius:10px;padding:12px 14px;margin-bottom:12px;font-size:13px;color:#dc2626;display:none;}
    .conflict-banner button{background:#dc2626;color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;margin-top:8px;}
  </style>
</head>
<body>

<div class="top-bar" style="background:#7c2d12;">
  <button class="top-bar-btn" onclick="confirmBack()">&#8592;</button>
  <div style="flex:1;min-width:0;">
    <div class="top-bar-title" id="tbTitle">Posizione porte</div>
    <div style="font-size:11px;opacity:.7;" id="tbSub">Nuovo</div>
  </div>
  <button class="top-bar-btn" style="background:var(--c-orange);border-radius:8px;width:auto;padding:0 14px;font-size:13px;font-weight:700;" onclick="salva()">&#128190; Salva</button>
</div>

<div style="position:fixed;top:56px;bottom:0;left:0;right:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 32px;">

  <div class="conflict-banner" id="conflictBanner">
    &#9888; Record modificato da un altro utente.
    <br><button onclick="forceOverwrite()">Sovrascrivi</button>
    <button onclick="reloadRecord()" style="background:var(--c-orange);">Aggiorna e riapri</button>
  </div>

  <div class="calc-strip">
    <div><div class="calc-lbl">L &times; H inserita</div><div class="calc-val" id="cLins">—</div></div>
    <div><div class="calc-lbl">L &times; H ordine</div><div class="calc-val" id="cLord">—</div></div>
  </div>

  <!-- DATI GENERALI -->
  <div class="fsec">
    <div class="fsec-hdr">&#128203; DATI GENERALI</div>
    <div class="fsec-body">
      <div class="form-group-m">
        <label class="form-label-m">N&deg; posizione <span style="font-size:10px;font-weight:400;">(max 7 caratteri)</span></label>
        <input class="form-ctrl" type="text" id="fNumAlfa" maxlength="7" placeholder="es. CAM01" oninput="this.value=this.value.toUpperCase()" onchange="markDirty()"/>
      </div>
      <div class="form-row-2m">
        <div class="form-group-m">
          <label class="form-label-m">Piano <span class="req">*</span></label>
          <select class="form-ctrl" id="fPiano" onchange="markDirty()"><option value="">—</option></select>
        </div>
        <div class="form-group-m">
          <label class="form-label-m">Ambiente</label>
          <input class="form-ctrl" type="text" id="fAmbiente" placeholder="es. Cucina" onchange="markDirty()"/>
        </div>
      </div>
      <div class="form-row-2m">
        <div class="form-group-m">
          <label class="form-label-m">Tipo porta <span class="req">*</span></label>
          <select class="form-ctrl" id="fTipoPorta" onchange="markDirty()"><option value="">— Tipo —</option></select>
        </div>
        <div class="form-group-m">
          <label class="form-label-m">N foglie</label>
          <select class="form-ctrl" id="fNFoglie" onchange="markDirty()">
            <option value="">—</option><option value="1">1</option><option value="2">2</option><option value="3">3</option>
          </select>
        </div>
      </div>
      <div class="form-row-2m">
        <div class="form-group-m">
          <label class="form-label-m">Tipo foro <span class="req">*</span></label>
          <select class="form-ctrl" id="fTipoForo" onchange="ricalcola()">
            <option value="">— Foro —</option>
            <option value="N">N — Netta passaggio</option>
            <option value="P">P — Posa in luce</option>
          </select>
        </div>
        <div class="form-group-m">
          <label class="form-label-m">Senso apertura</label>
          <select class="form-ctrl" id="fSenso" onchange="markDirty()"><option value="">—</option></select>
        </div>
      </div>
      <div class="form-row-2m">
        <div class="form-group-m">
          <label class="form-label-m">L foro (mm) <span class="req">*</span></label>
          <input class="form-ctrl" type="number" id="fLmm" inputmode="numeric" placeholder="800" oninput="ricalcola()"/>
        </div>
        <div class="form-group-m">
          <label class="form-label-m">H foro (mm) <span class="req">*</span></label>
          <input class="form-ctrl" type="number" id="fHmm" inputmode="numeric" placeholder="2100" oninput="ricalcola()"/>
        </div>
      </div>
      <div>
        <div class="chk-row"><input type="checkbox" id="fRimozione" onchange="markDirty()"/><label for="fRimozione">Rimozione porta esistente</label></div>
        <div class="chk-row"><input type="checkbox" id="fTaglioMarmo" onchange="markDirty()"/><label for="fTaglioMarmo">Taglio piani marmo</label></div>
        <div class="chk-row"><input type="checkbox" id="fAngolariPvc" onchange="markDirty()"/><label for="fAngolariPvc">Angolari PVC</label></div>
      </div>
      <div class="form-group-m" style="margin-top:10px;">
        <label class="form-label-m">Note</label>
        <textarea class="form-ctrl" id="fNote" rows="2" onchange="markDirty()"></textarea>
      </div>
    </div>
  </div>

  <!-- PORTA -->
  <div class="fsec">
    <div class="fsec-hdr">&#128682; PORTA</div>
    <div class="fsec-body">
      <div class="form-group-m">
        <label class="form-label-m">Fornitore <span class="req">*</span></label>
        <select class="form-ctrl" id="fFornitore" onchange="onFornitoreChange()"><option value="">— Fornitore —</option></select>
      </div>
      <div class="form-group-m">
        <label class="form-label-m">Sistema <span class="req">*</span></label>
        <select class="form-ctrl" id="fSistema" onchange="onSistemaChange()" disabled><option value="">— seleziona fornitore —</option></select>
      </div>
      <div class="form-row-2m">
        <div class="form-group-m">
          <label class="form-label-m">Stile design</label>
          <select class="form-ctrl" id="fStile" onchange="onStileChange()" disabled><option value="">—</option></select>
        </div>
        <div class="form-group-m">
          <label class="form-label-m">Variante telaio</label>
          <select class="form-ctrl" id="fVariante" onchange="ricalcola()" disabled><option value="">—</option></select>
        </div>
      </div>
      <div class="form-row-2m">
        <div class="form-group-m">
          <label class="form-label-m">Colore interno</label>
          <select class="form-ctrl" id="fColoreInt" onchange="onColoreIntChange()" disabled><option value="">—</option></select>
        </div>
        <div class="form-group-m">
          <label class="form-label-m">Colore esterno</label>
          <select class="form-ctrl" id="fColoreEst" onchange="markDirty()" disabled><option value="">—</option></select>
        </div>
      </div>
    </div>
  </div>

  <!-- INSTALLAZIONE -->
  <div class="fsec">
    <div class="fsec-hdr">&#9881; INSTALLAZIONE</div>
    <div class="fsec-body">
      <div class="form-row-2m">
        <div class="form-group-m">
          <label class="form-label-m">Controtelaio</label>
          <select class="form-ctrl" id="fControtelaio" onchange="markDirty()">
            <option value="">— Nessuno —</option>
            <option value="L">CTL Legno</option>
            <option value="T">Termocassa</option>
          </select>
        </div>
        <div class="form-group-m">
          <label class="form-label-m" style="padding-top:20px;">&nbsp;</label>
          <div class="chk-row" style="padding:11px 0;border:none;">
            <input type="checkbox" id="fRivestimento" onchange="markDirty()"/>
            <label for="fRivestimento">Rivestimento stipiti</label>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div style="padding:16px 14px 24px;">
    <button class="btn btn-orange btn-full btn-lg" onclick="salva()">&#128190; Salva posizione</button>
    <div style="text-align:center;margin-top:12px;">
      <button class="btn btn-ghost" onclick="confirmBack()">Annulla e torna indietro</button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/db-local.js"></script>
<script src="js/api-mobile.js"></script>
<script>
var currentUser=Auth.requireLogin();
if(!currentUser) throw new Error('not logged');

var params=new URLSearchParams(window.location.search);
var idRilievo=params.get('id_rilievo');
var idPos=params.get('id');
var isNew=!idPos;
var _dirty=false, _loadedAt=0, _rec={}, _dbPorte=[], _lkColori=[];

if(!idRilievo){ history.back(); }

function ricalcola(){
  markDirty();
  var L=parseFloat(document.getElementById('fLmm').value)||0;
  var H=parseFloat(document.getElementById('fHmm').value)||0;
  var tf=document.getElementById('fTipoForo').value;
  document.getElementById('cLins').textContent=(L&&H)?L+' x '+H:'—';
  if(!L||!H){ document.getElementById('cLord').textContent='—'; return; }
  var ord=null;
  if(tf==='N'){ ord={Lt:L,Ht:H}; }
  else if(tf==='P'){
    var forn=document.getElementById('fFornitore').value;
    var sis=document.getElementById('fSistema').value;
    var stil=document.getElementById('fStile').value;
    var rec=null;
    for(var i=0;i<_dbPorte.length;i++){ var d=_dbPorte[i]; if((d.fornitore===forn||!forn)&&(d.descrizione===sis||d.sistema===sis)&&(!stil||d.stile_design===stil)){rec=d;break;} }
    var offL=rec?(parseFloat(rec.offset_larghezza_mm)||0):0;
    var offH=rec?(parseFloat(rec.offset_altezza_mm)||0):0;
    ord={Lt:Math.round(L+offL),Ht:Math.round(H+offH)};
  }
  document.getElementById('cLord').textContent=ord?ord.Lt+' x '+ord.Ht:'—';
}
function markDirty(){ _dirty=true; }

function load(){
  DBLocal.getAll('db_porte',function(db){ _dbPorte=db;
    DBLocal.getLookup('LK_COLORI',function(col){ _lkColori=col||[];
      buildDropdowns(function(){
        if(isNew) setupNew(); else loadExisting();
      });
    });
  });
}

function buildDropdowns(cb){
  var pending=4;
  function done(){ pending--; if(pending<=0&&cb){cb();cb=null;} }
  function fillS(id,lk,v,l){ DBLocal.getLookup(lk,function(rows){ var sel=document.getElementById(id); while(sel.options.length>1)sel.remove(1); (rows||[]).forEach(function(r){sel.appendChild(new Option(r[l]?r[v]+' — '+r[l]:r[v],r[v]));}); done(); }); }
  fillS('fPiano','LK_PIANO','piano','descrizione');
  fillS('fTipoPorta','LK_TIPO_PORTA','sigla','descrizione');
  fillS('fSenso','LK_SENSI_APERTURA','sigla','descrizione');
  // fornitori da db_porte
  var forn=[]; _dbPorte.forEach(function(r){if(r.fornitore&&forn.indexOf(r.fornitore)<0)forn.push(r.fornitore);}); forn.sort();
  var selF=document.getElementById('fFornitore'); while(selF.options.length>1)selF.remove(1);
  forn.forEach(function(f){selF.appendChild(new Option(f,f));});
  done();
}

function onFornitoreChange(){
  markDirty();
  var forn=document.getElementById('fFornitore').value;
  var selS=document.getElementById('fSistema'); while(selS.options.length>1)selS.remove(1); selS.disabled=!forn;
  if(!forn){['fStile','fVariante'].forEach(function(id){var s=document.getElementById(id);while(s.options.length>1)s.remove(1);s.disabled=true;});return;}
  var sis=[]; _dbPorte.forEach(function(r){if(r.fornitore===forn){var v=r.descrizione||r.sistema;if(v&&sis.indexOf(v)<0)sis.push(v);}});sis.sort();
  sis.forEach(function(s){selS.appendChild(new Option(s,s));});
  selS.disabled=false;
  updateColoriDropdowns();ricalcola();
}
function onSistemaChange(){
  markDirty();
  var forn=document.getElementById('fFornitore').value;
  var sis=document.getElementById('fSistema').value;
  var selSt=document.getElementById('fStile'); while(selSt.options.length>1)selSt.remove(1);
  if(!sis){selSt.disabled=true;return;}
  var stili=[]; _dbPorte.forEach(function(r){if(r.fornitore===forn&&(r.descrizione===sis||r.sistema===sis)){if(r.stile_design&&stili.indexOf(r.stile_design)<0)stili.push(r.stile_design);}});stili.sort();
  stili.forEach(function(s){selSt.appendChild(new Option(s,s));});
  selSt.disabled=false;
  var selV=document.getElementById('fVariante'); while(selV.options.length>1)selV.remove(1); selV.disabled=true;
  ricalcola();
}
function onStileChange(){
  markDirty();
  var forn=document.getElementById('fFornitore').value;
  var sis=document.getElementById('fSistema').value;
  var stil=document.getElementById('fStile').value;
  var selV=document.getElementById('fVariante'); while(selV.options.length>1)selV.remove(1);
  if(!stil){selV.disabled=true;return;}
  var vari=[]; _dbPorte.forEach(function(r){if(r.fornitore===forn&&(r.descrizione===sis||r.sistema===sis)&&r.stile_design===stil){if(r.variante_telaio&&vari.indexOf(r.variante_telaio)<0)vari.push(r.variante_telaio);}});vari.sort();
  vari.forEach(function(v){selV.appendChild(new Option(v,v));});
  selV.disabled=false; ricalcola();
}
function updateColoriDropdowns(){
  var selI=document.getElementById('fColoreInt'); while(selI.options.length>1)selI.remove(1);
  var ints=[]; _lkColori.forEach(function(r){if(r.colore_interno&&ints.indexOf(r.colore_interno)<0)ints.push(r.colore_interno);}); ints.sort();
  ints.forEach(function(c){selI.appendChild(new Option(c,c));}); selI.disabled=false;
}
function onColoreIntChange(){
  markDirty();
  var ci=document.getElementById('fColoreInt').value;
  var selE=document.getElementById('fColoreEst'); while(selE.options.length>1)selE.remove(1); selE.disabled=!ci;
  var ests=[]; _lkColori.forEach(function(r){if(r.colore_interno===ci&&r.colore_esterno&&ests.indexOf(r.colore_esterno)<0)ests.push(r.colore_esterno);}); ests.sort();
  ests.forEach(function(c){selE.appendChild(new Option(c,c));}); if(ests.length===1)selE.value=ests[0];
}

function setupNew(){
  document.getElementById('tbTitle').textContent='Nuova posizione';
  document.getElementById('tbSub').textContent='Rilievo '+idRilievo.substring(0,8);
  _loadedAt=Date.now(); _rec={id_rilievo:idRilievo,stato:'attivo'};
}
function loadExisting(){
  DBLocal.getById('posizioni_porte',idPos,function(p){
    if(!p){alert('Posizione non trovata');history.back();return;}
    _rec=p; _loadedAt=new Date(p.updated_at||0).getTime()||Date.now();
    document.getElementById('tbTitle').textContent='Posizione '+(p.numero_pos_alfa||p.numero_pos||'?');
    document.getElementById('tbSub').textContent='Modifica';
    populateForm(p);
  });
}
function populateForm(p){
  function sv(id,v){ var el=document.getElementById(id);if(el)el.value=v||''; }
  function sc(id,v){ var el=document.getElementById(id);if(el)el.checked=!!v; }
  sv('fNumAlfa',p.numero_pos_alfa); sv('fPiano',p.piano!=null?p.piano:'');
  sv('fAmbiente',p.ambiente); sv('fTipoPorta',p.tipo_porta);
  sv('fNFoglie',p.n_foglie); sv('fTipoForo',p.tipo_foro); sv('fSenso',p.senso_apertura);
  sv('fLmm',p.L_mm||p.l_mm); sv('fHmm',p.H_mm||p.h_mm); sv('fNote',p.note);
  sc('fRimozione',p.rimozione==='SI'||p.rimozione===true);
  sc('fTaglioMarmo',p.taglio_marmo); sc('fAngolariPvc',p.angolari_pvc);
  sc('fRivestimento',p.rivestimento_stipiti); sv('fControtelaio',p.controtelaio);
  sv('fFornitore',p.fornitore);
  if(p.fornitore){ onFornitoreChange(); setTimeout(function(){
    sv('fSistema',p.sistema);
    if(p.sistema){ onSistemaChange(); setTimeout(function(){
      sv('fStile',p.stile_design);
      if(p.stile_design){ onStileChange(); setTimeout(function(){
        sv('fVariante',p.variante_telaio);
        updateColoriDropdowns(); setTimeout(function(){
          sv('fColoreInt',p.colore_int); onColoreIntChange(); setTimeout(function(){ sv('fColoreEst',p.colore_est); },100);
        },100);
        ricalcola(); _dirty=false;
      },100); }
    },100); }
  },100); }
}

function raccogliDati(){
  return Object.assign({},_rec,{
    numero_pos_alfa:document.getElementById('fNumAlfa').value||null,
    piano:(function(v){return v!==''?parseInt(v):null;})(document.getElementById('fPiano').value),
    ambiente:document.getElementById('fAmbiente').value||null,
    tipo_porta:document.getElementById('fTipoPorta').value||null,
    n_foglie:document.getElementById('fNFoglie').value||null,
    tipo_foro:document.getElementById('fTipoForo').value||null,
    senso_apertura:document.getElementById('fSenso').value||null,
    L_mm:parseInt(document.getElementById('fLmm').value)||null,
    H_mm:parseInt(document.getElementById('fHmm').value)||null,
    fornitore:document.getElementById('fFornitore').value||null,
    sistema:document.getElementById('fSistema').value||null,
    stile_design:document.getElementById('fStile').value||null,
    variante_telaio:document.getElementById('fVariante').value||null,
    colore_int:document.getElementById('fColoreInt').value||null,
    colore_est:document.getElementById('fColoreEst').value||null,
    controtelaio:document.getElementById('fControtelaio').value||null,
    rivestimento_stipiti:document.getElementById('fRivestimento').checked||null,
    rimozione:document.getElementById('fRimozione').checked?'SI':null,
    taglio_marmo:document.getElementById('fTaglioMarmo').checked||null,
    angolari_pvc:document.getElementById('fAngolariPvc').checked||null,
    note:document.getElementById('fNote').value||null,
    stato:'attivo'
  });
}
function valida(){
  var errs=[];
  if(!document.getElementById('fTipoForo').value) errs.push('Tipo foro obbligatorio');
  if(!document.getElementById('fLmm').value) errs.push('L foro obbligatorio');
  if(!document.getElementById('fHmm').value) errs.push('H foro obbligatorio');
  if(!document.getElementById('fFornitore').value) errs.push('Fornitore obbligatorio');
  return errs;
}
function salva(){
  var errs=valida();
  if(errs.length){alert('Campi obbligatori:\n'+errs.join('\n'));return;}
  var data=raccogliDati();
  var op=isNew?'insert':'update';
  var btn=document.querySelector('button[onclick="salva()"]');
  btn.disabled=true; btn.textContent='Salvataggio...';
  API.savePosizione('posizioni_porte',op,data,isNew?null:_loadedAt,function(err,saved,conflict){
    btn.disabled=false; btn.innerHTML='&#128190; Salva posizione';
    if(conflict){document.getElementById('conflictBanner').style.display='';window.scrollTo(0,0);return;}
    if(err){alert('Errore: '+err);return;}
    _dirty=false;
    API.miniSync('posizioni_porte',function(){ window.location.href='rilievo-porte.html?id='+idRilievo; });
  });
}
function forceOverwrite(){
  document.getElementById('conflictBanner').style.display='none';
  API.savePosizione('posizioni_porte','update',raccogliDati(),null,function(err){
    if(err){alert('Errore: '+err);return;}
    _dirty=false; window.location.href='rilievo-porte.html?id='+idRilievo;
  });
}
function reloadRecord(){
  window.location.href='pos-porte-edit.html?id_rilievo='+idRilievo+'&id='+idPos;
}
function confirmBack(){
  if(_dirty&&!confirm('Hai modifiche non salvate. Vuoi uscire?')) return;
  window.location.href='rilievo-porte.html?id='+idRilievo;
}
window.addEventListener('beforeunload',function(e){if(_dirty){e.preventDefault();e.returnValue='';}});
load();
</script>
</body>
</html>
