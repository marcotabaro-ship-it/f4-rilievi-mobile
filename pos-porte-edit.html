<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <title>Posizione porte — F4 Rilievi</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/mobile.css"/>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#1a1a2e"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <style>
    .fsec{background:var(--c-surface);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;}
    .fsec-hdr{background:#7c2d12;color:#fed7aa;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;padding:8px 14px;display:flex;align-items:center;gap:8px;}
    .fsec-body{padding:14px;}
    .form-row-2m{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .form-group-m{margin-bottom:12px;}
    .form-label-m{display:block;font-size:11px;font-weight:600;color:var(--c-text-sec);margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px;}
    .req{color:var(--c-red);}
    .form-ctrl{width:100%;border:2px solid var(--c-border);border-radius:10px;padding:11px 13px;font-size:15px;font-family:inherit;color:var(--c-text);background:var(--c-surface);outline:none;-webkit-appearance:none;transition:border-color .15s;box-sizing:border-box;}
    .form-ctrl:focus{border-color:var(--c-orange);}
    .form-ctrl:disabled{background:var(--c-bg);color:var(--c-text-sec);}
    .chk-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--c-border);cursor:pointer;}
    .chk-row:last-child{border-bottom:none;}
    .chk-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--c-orange);flex-shrink:0;}
    .chk-row label{font-size:14px;color:var(--c-text);cursor:pointer;flex:1;}
    .calc-strip{background:#fff7ed;border:1px solid #fdba74;border-radius:10px;padding:10px 14px;margin-bottom:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
    .calc-lbl{font-size:11px;color:var(--c-text-sec);}
    .calc-val{font-size:14px;font-weight:700;color:var(--c-orange);}
    .conflict-banner{background:#fee2e2;border:1px solid #fca5a5;border-radius:10px;padding:12px 14px;margin-bottom:12px;font-size:13px;color:#dc2626;display:none;}
    .conflict-banner button{background:#dc2626;color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;margin-top:8px;margin-right:6px;}
  </style>
</head>
<body>

<div class="top-bar" style="background:#7c2d12;">
  <button class="top-bar-btn" onclick="confirmBack()">&#8592;</button>
  <div style="flex:1;min-width:0;">
    <div class="top-bar-title" id="tbTitle">Posizione porte</div>
    <div style="font-size:11px;opacity:.7;" id="tbSub">Nuovo</div>
  </div>
  <button class="top-bar-btn" style="background:var(--c-orange);border-radius:8px;width:auto;padding:0 14px;font-size:13px;font-weight:700;" onclick="salva()">&#128190; Salva</button>
</div>

<div style="position:fixed;top:56px;bottom:72px;left:0;right:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px 8px;" id="formWrap">

  <div class="calc-strip">
    <div><div class="calc-lbl">L &times; H inserita</div><div class="calc-val" id="cLins">—</div></div>
    <div><div class="calc-lbl">L &times; H ordine</div><div class="calc-val" id="cLord">—</div></div>
  </div>

  <div class="conflict-banner" id="conflictBanner">
    &#9888; Record modificato da un altro utente.
    <br>
    <button onclick="reloadRecord()">Ricarica</button>
    <button onclick="forceOverwrite()" style="background:var(--c-orange);">Sovrascrivi</button>
  </div>

  <!-- DATI GENERALI -->
  <div class="fsec">
    <div class="fsec-hdr">&#128203; DATI GENERALI</div>
    <div class="fsec-body">
      <div class="form-group-m">
        <label class="form-label-m">N&#176; posizione <span style="font-size:10px;font-weight:400;">(max 7 car.)</span></label>
        <input class="form-ctrl" type="text" id="fNumAlfa" maxlength="7" placeholder="es. CAM01"
          oninput="this.value=this.value.toUpperCase()" onchange="markDirty()"/>
      </div>
      <div class="form-row-2m">
        <div class="form-group-m">
          <label class="form-label-m">Piano <span class="req">*</span></label>
          <select class="form-ctrl" id="fPiano" onchange="markDirty()"><option value="">— Piano —</option></select>
        </div>
        <div class="form-group-m">
          <label class="form-label-m">Ambiente</label>
          <input class="form-ctrl" type="text" id="fAmbiente" placeholder="es. Cucina" onchange="markDirty()"/>
        </div>
      </div>
      <div class="form-row-2m">
        <div class="form-group-m">
          <label class="form-label-m">Tipo porta <span class="req">*</span></label>
          <!-- 1B FIX: onchange chiama onTipoPortaChange() invece di solo markDirty() -->
          <select class="form-ctrl" id="fTipoPorta" onchange="onTipoPortaChange()">
            <option value="">— Tipo —</option>
            <option value="INT">INT — Interna</option>
            <option value="BLI">BLI — Blindata</option>
            <option value="REI">REI — REI</option>
          </select>
        </div>
        <div class="form-group-m">
          <label class="form-label-m">Tipo foro <span class="req">*</span></label>
          <select class="form-ctrl" id="fTipoForo" onchange="ricalcola()">
            <option value="">— Foro —</option>
            <option value="N">N — Netta passaggio</option>
            <option value="P">P — Posa in luce</option>
          </select>
        </div>
      </div>
      <div class="form-row-2m">
        <div class="form-group-m">
          <label class="form-label-m">L foro (mm) <span class="req">*</span></label>
          <input class="form-ctrl" type="number" id="fLmm" inputmode="numeric" placeholder="800" oninput="ricalcola()"/>
        </div>
        <div class="form-group-m">
          <label class="form-label-m">H foro (mm) <span class="req">*</span></label>
          <input class="form-ctrl" type="number" id="fHmm" inputmode="numeric" placeholder="2100" oninput="ricalcola()"/>
        </div>
      </div>
      <div class="form-row-2m">
        <div class="form-group-m">
          <label class="form-label-m">Sp. muro (mm)</label>
          <input class="form-ctrl" type="number" id="fSpMuro" inputmode="numeric" placeholder="es. 150" onchange="markDirty()"/>
        </div>
        <div class="form-group-m">
          <label class="form-label-m">Decentr. telaio (mm)</label>
          <input class="form-ctrl" type="number" id="fDecentrato" inputmode="numeric" placeholder="es. 0" onchange="markDirty()"/>
        </div>
      </div>
      <div class="form-group-m" style="margin-top:2px;">
        <div class="chk-row"><input type="checkbox" id="fSopraluce" onchange="markDirty()"/><label for="fSopraluce">Sopraluce presente</label></div>
        <div class="chk-row"><input type="checkbox" id="fRimozione" onchange="markDirty()"/><label for="fRimozione">Rimozione porta esistente</label></div>
        <div class="chk-row"><input type="checkbox" id="fAllargamento" onchange="toggleAllargamento()"/><label for="fAllargamento">Allargamento telaio</label></div>
      </div>
      <div class="form-group-m" id="grpAllargMm" style="display:none;">
        <label class="form-label-m">Allargamento (mm)</label>
        <input class="form-ctrl" type="number" id="fAllargamentoMm" inputmode="numeric" placeholder="es. 50" onchange="markDirty()"/>
      </div>
      <div class="form-group-m" style="margin-top:10px;">
        <label class="form-label-m">Note</label>
        <textarea class="form-ctrl" id="fNote" rows="2" onchange="markDirty()"></textarea>
      </div>
    </div>
  </div>

  <!-- PORTA -->
  <div class="fsec">
    <div class="fsec-hdr">&#128682; PORTA</div>
    <div class="fsec-body">
      <div class="form-group-m">
        <label class="form-label-m">Fornitore <span class="req">*</span></label>
        <select class="form-ctrl" id="fFornitore" onchange="onFornitoreChange()"><option value="">— Fornitore —</option></select>
      </div>
      <div class="form-group-m">
        <label class="form-label-m">Sistema <span class="req">*</span></label>
        <select class="form-ctrl" id="fSistema" onchange="markDirty()" disabled><option value="">— seleziona fornitore —</option></select>
      </div>
      <div class="form-row-2m">
        <div class="form-group-m">
          <label class="form-label-m">Collezione</label>
          <input class="form-ctrl" type="text" id="fCollezione" placeholder="es. GAROFOLI" onchange="markDirty()"/>
        </div>
        <div class="form-group-m">
          <label class="form-label-m">Modello</label>
          <input class="form-ctrl" type="text" id="fModello" placeholder="es. ALPHA" onchange="markDirty()"/>
        </div>
      </div>
      <div class="form-row-2m">
        <div class="form-group-m">
          <label class="form-label-m">Versione porta</label>
          <input class="form-ctrl" type="text" id="fVersione" placeholder="es. RASOMURO" onchange="markDirty()"/>
        </div>
        <div class="form-group-m">
          <label class="form-label-m">Essenza</label>
          <input class="form-ctrl" type="text" id="fEssenza" placeholder="es. ROVERE" onchange="markDirty()"/>
        </div>
      </div>
      <div class="form-group-m">
        <label class="form-label-m">Verso apertura</label>
        <select class="form-ctrl" id="fVerso" onchange="markDirty()">
          <option value="">—</option>
          <option value="D">D — Destra</option>
          <option value="S">S — Sinistra</option>
          <option value="DS">DS — Doppio senso</option>
        </select>
      </div>
    </div>
  </div>

  <!-- CONTROTELAIO -->
  <div class="fsec">
    <div class="fsec-hdr">&#9881; CONTROTELAIO</div>
    <div class="fsec-body">
      <div class="form-group-m" style="margin-bottom:6px;">
        <label class="form-label-m">Fornitura CTL</label>
        <!-- 1B: i checkbox vengono abilitati/disabilitati da aggiornaCTL() in base a tipo_porta -->
        <div class="chk-row" id="rowFornCTLInt"><input type="checkbox" id="fFornCTLInt" onchange="markDirty()"/><label for="fFornCTLInt">Fornitura CTL porta interna</label></div>
        <div class="chk-row" id="rowFornCTLBli"><input type="checkbox" id="fFornCTLBli" onchange="markDirty()"/><label for="fFornCTLBli">Fornitura CTL blindata</label></div>
        <div class="chk-row" id="rowFornCTLRei"><input type="checkbox" id="fFornCTLRei" onchange="markDirty()"/><label for="fFornCTLRei">Fornitura CTL REI</label></div>
      </div>
      <div class="form-group-m" style="margin-bottom:0;">
        <label class="form-label-m">Installazione CTL</label>
        <div class="chk-row" id="rowInstCTLInt"><input type="checkbox" id="fInstCTLInt" onchange="markDirty()"/><label for="fInstCTLInt">Installazione CTL porta interna</label></div>
        <div class="chk-row" id="rowInstCTLBli"><input type="checkbox" id="fInstCTLBli" onchange="markDirty()"/><label for="fInstCTLBli">Installazione CTL blindata</label></div>
        <div class="chk-row" id="rowInstCTLRei"><input type="checkbox" id="fInstCTLRei" onchange="markDirty()"/><label for="fInstCTLRei">Installazione CTL REI</label></div>
      </div>
    </div>
  </div>

  <!-- SERRATURA E FINITURE -->
  <div class="fsec">
    <div class="fsec-hdr">&#128273; SERRATURA E FINITURE</div>
    <div class="fsec-body">
      <div class="form-row-2m">
        <div class="form-group-m">
          <label class="form-label-m">Tipo serratura</label>
          <input class="form-ctrl" type="text" id="fTipoSerratura" placeholder="es. PATENT" onchange="markDirty()"/>
        </div>
        <div class="form-group-m">
          <label class="form-label-m">Colore serratura</label>
          <input class="form-ctrl" type="text" id="fColoreSerratura" placeholder="es. CROMO" onchange="markDirty()"/>
        </div>
      </div>
      <div class="form-row-2m">
        <div class="form-group-m">
          <label class="form-label-m">Colore cerniere</label>
          <input class="form-ctrl" type="text" id="fColoreCerniere" placeholder="es. INOX" onchange="markDirty()"/>
        </div>
        <div class="form-group-m">
          <label class="form-label-m">Maniglia — marca</label>
          <input class="form-ctrl" type="text" id="fManigliaMarca" onchange="markDirty()"/>
        </div>
      </div>
      <div class="form-row-2m">
        <div class="form-group-m">
          <label class="form-label-m">Maniglia — modello</label>
          <input class="form-ctrl" type="text" id="fManigliaModello" onchange="markDirty()"/>
        </div>
        <div class="form-group-m">
          <label class="form-label-m">Maniglia — colore/mat.</label>
          <input class="form-ctrl" type="text" id="fManigliaColore" onchange="markDirty()"/>
        </div>
      </div>
      <div class="chk-row"><input type="checkbox" id="fVetri" onchange="markDirty()"/><label for="fVetri">Presenza vetri</label></div>
      <div class="chk-row"><input type="checkbox" id="fMostrine" onchange="markDirty()"/><label for="fMostrine">Mostrine presenti</label></div>
    </div>
  </div>

</div>

<div style="position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid #e5e7eb;padding:12px 16px;display:flex;gap:10px;z-index:100;box-shadow:0 -2px 12px rgba(0,0,0,.1);">
  <button onclick="confirmBack()" style="padding:14px 20px;background:#f3f4f6;color:#374151;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;">&#8592;</button>
  <button onclick="salva()" style="flex:1;padding:14px;background:var(--c-orange);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;">&#128190; Salva posizione</button>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/db-local.js"></script>
<script src="js/api-mobile.js"></script>
<script>
var currentUser = Auth.requireLogin();
if (!currentUser) throw new Error('not logged');

var params    = new URLSearchParams(window.location.search);
var idRilievo = params.get('id_rilievo');
var idPos     = params.get('id');
var isNew     = !idPos;
var _dirty = false, _loadedAt = 0, _rec = {}, _dbPorte = [];
var _nextNumPos = 1;

if (!idRilievo) { history.back(); }

// ── UTILITY ──
function setOpt(id, val) {
  if (val === null || val === undefined || val === '') return;
  var v = String(val);
  var el = document.getElementById(id); if (!el) return;
  if (el.tagName === 'SELECT') {
    if (!Array.from(el.options).some(function(o){ return o.value === v; })) {
      var o = document.createElement('option'); o.value = v; o.text = v; el.appendChild(o);
    }
  }
  el.value = v;
}
function sc(id, val) {
  var el = document.getElementById(id);
  if (el) el.checked = !!(val === true || val === 'true' || val === 'SI');
}
function gv(id) { var el = document.getElementById(id); return el ? (el.value || null) : null; }
function gb(id) { var el = document.getElementById(id); return el ? el.checked : false; }
function markDirty() { _dirty = true; }

// ── CALCOLO DIMENSIONE ORDINE ──
function ricalcola() {
  markDirty();
  var L = parseFloat(document.getElementById('fLmm').value) || 0;
  var H = parseFloat(document.getElementById('fHmm').value) || 0;
  document.getElementById('cLins').textContent = (L && H) ? L + ' x ' + H : '—';
  if (!L || !H) { document.getElementById('cLord').textContent = '—'; return; }
  var tf = document.getElementById('fTipoForo').value;
  if (tf === 'N') {
    document.getElementById('cLord').textContent = Math.round(L) + ' x ' + Math.round(H);
    return;
  }
  if (tf === 'P') {
    var forn = document.getElementById('fFornitore').value;
    var sis  = document.getElementById('fSistema').value;
    var rec  = _dbPorte.find(function(d){ return d.fornitore === forn && (d.descrizione === sis || d.sistema === sis); });
    var offL = rec ? (parseFloat(rec.offset_larghezza_mm) || 0) : 0;
    var offH = rec ? (parseFloat(rec.offset_altezza_mm)   || 0) : 0;
    document.getElementById('cLord').textContent = Math.round(L + offL) + ' x ' + Math.round(H + offH);
    return;
  }
  document.getElementById('cLord').textContent = '—';
}

function toggleAllargamento() {
  markDirty();
  var chk = document.getElementById('fAllargamento').checked;
  document.getElementById('grpAllargMm').style.display = chk ? 'block' : 'none';
}

// ── CASCADE FORNITORE → SISTEMA ──
function onFornitoreChange(silent) {
  if (!silent) markDirty();
  var forn = document.getElementById('fFornitore').value;
  var selS = document.getElementById('fSistema');
  selS.innerHTML = '<option value="">— seleziona fornitore —</option>';
  selS.disabled  = !forn;
  if (!forn) return;
  var sis = [];
  _dbPorte.forEach(function(d){ if (d.fornitore === forn){ var v = d.descrizione || d.sistema; if (v && sis.indexOf(v) < 0) sis.push(v); } });
  sis.sort();
  sis.forEach(function(s){ selS.appendChild(new Option(s, s)); });
  selS.disabled = false;
  ricalcola();
}

// ── 1B FIX: GESTIONE CTL IN BASE A TIPO PORTA ──

// aggiornaCTL — abilita i soli 2 CTL coerenti con tipo_porta,
// disabilita e azzera tutti gli altri.
// Chiamata: al cambio tipo_porta, all'apertura (populateForm) e su nuova posizione (setupNew).
function aggiornaCTL() {
  var tipoP = document.getElementById('fTipoPorta').value;

  // Mappa tipo_porta → id checkbox abilitati
  var mappa = {
    'INT': ['fFornCTLInt', 'fInstCTLInt'],
    'BLI': ['fFornCTLBli', 'fInstCTLBli'],
    'REI': ['fFornCTLRei', 'fInstCTLRei']
  };
  // id riga wrapper corrispondente a ogni checkbox
  var rowMap = {
    'fFornCTLInt': 'rowFornCTLInt',
    'fFornCTLBli': 'rowFornCTLBli',
    'fFornCTLRei': 'rowFornCTLRei',
    'fInstCTLInt': 'rowInstCTLInt',
    'fInstCTLBli': 'rowInstCTLBli',
    'fInstCTLRei': 'rowInstCTLRei'
  };

  var tuttiCTL = ['fFornCTLInt','fFornCTLBli','fFornCTLRei',
                  'fInstCTLInt','fInstCTLBli','fInstCTLRei'];
  var attivi   = mappa[tipoP] || [];  // [] se tipo vuoto → tutto disabilitato

  tuttiCTL.forEach(function(id) {
    var el  = document.getElementById(id);
    var row = document.getElementById(rowMap[id]);
    if (!el) return;
    var abilitato = attivi.indexOf(id) >= 0;
    el.disabled = !abilitato;
    if (!abilitato) el.checked = false;   // azzera i CTL non coerenti
    if (row) row.style.opacity = abilitato ? '1' : '0.35';
  });
}

// onTipoPortaChange — handler del select fTipoPorta
function onTipoPortaChange() {
  markDirty();
  aggiornaCTL();
}

// ── CARICAMENTO INIZIALE ──
function load() {
  // Prossimo numero posizione
  DBLocal.getAll('posizioni_porte', function(allPos){
    var fr = allPos.filter(function(p){ return p.id_rilievo === idRilievo; });
    var mx = 0;
    fr.forEach(function(p){ if ((parseInt(p.numero_pos) || 0) > mx) mx = parseInt(p.numero_pos) || 0; });
    _nextNumPos = mx + 1;
  });

  // Piano
  DBLocal.getLookup('LK_PIANO', function(rows){
    var sel = document.getElementById('fPiano');
    while (sel.options.length > 1) sel.remove(1);
    (rows || []).sort(function(a,b){ return a.piano - b.piano; }).forEach(function(r){
      sel.appendChild(new Option('Piano ' + (r.piano >= 0 ? '+' : '') + r.piano, r.piano));
    });
  });

  // DB Porte per cascade fornitore → sistema
  DBLocal.getAll('db_porte', function(db){
    _dbPorte = db;
    var forn = [];
    db.forEach(function(d){ if (d.fornitore && forn.indexOf(d.fornitore) < 0) forn.push(d.fornitore); });
    forn.sort();
    var selF = document.getElementById('fFornitore');
    while (selF.options.length > 1) selF.remove(1);
    forn.forEach(function(f){ selF.appendChild(new Option(f, f)); });
    if (isNew) setupNew(); else loadExisting();
  });
}

function setupNew() {
  document.getElementById('tbTitle').textContent = 'Nuova posizione';
  document.getElementById('tbSub').textContent   = 'Porte';
  _loadedAt = Date.now();
  _rec = { id_rilievo: idRilievo, stato: 'attivo' };
  // 1B FIX: al caricamento di una nuova posizione, tipo_porta è vuoto
  // → tutti i CTL partono disabilitati finché l'utente non sceglie il tipo
  aggiornaCTL();
}

function loadExisting() {
  DBLocal.getById('posizioni_porte', idPos, function(p){
    if (!p) { alert('Posizione non trovata'); history.back(); return; }
    _rec = p; _loadedAt = new Date(p.updated_at || 0).getTime() || Date.now();
    document.getElementById('tbTitle').textContent = 'Posizione ' + (p.numero_pos_alfa || p.numero_pos || '?');
    document.getElementById('tbSub').textContent   = 'Modifica';
    populateForm(p);
  });
}

function populateForm(p) {
  setOpt('fNumAlfa', p.numero_pos_alfa);
  setOpt('fPiano', p.piano != null ? p.piano : '');
  setOpt('fAmbiente', p.ambiente);
  setOpt('fTipoPorta', p.tipo_porta);
  setOpt('fTipoForo',  p.tipo_foro);
  var lEl = document.getElementById('fLmm'); if (lEl) lEl.value = p.l_mm || p.L_mm || '';
  var hEl = document.getElementById('fHmm'); if (hEl) hEl.value = p.h_mm || p.H_mm || '';
  setOpt('fSpMuro',     p.sp_muro_mm);
  setOpt('fDecentrato', p.telaio_decentrato_mm);
  sc('fSopraluce',   p.sopraluce);
  sc('fRimozione',   p.rimozione);
  sc('fAllargamento', p.allargamento_telaio);
  toggleAllargamento();
  if (p.allargamento_mm) document.getElementById('fAllargamentoMm').value = p.allargamento_mm;
  var nEl = document.getElementById('fNote'); if (nEl) nEl.value = p.note || '';

  // Cascade fornitore → sistema
  if (p.fornitore) {
    setOpt('fFornitore', p.fornitore);
    onFornitoreChange(true);
    setOpt('fSistema', p.sistema);
  }

  setOpt('fCollezione',       p.collezione);
  setOpt('fModello',          p.modello);
  setOpt('fVersione',         p.versione_porta);
  setOpt('fEssenza',          p.essenza);
  setOpt('fVerso',            p.verso_apertura);
  setOpt('fTipoSerratura',    p.tipo_serratura);
  setOpt('fColoreSerratura',  p.colore_serratura);
  setOpt('fColoreCerniere',   p.colore_cerniere);
  setOpt('fManigliaMarca',    p.maniglia_marca);
  setOpt('fManigliaModello',  p.maniglia_modello);
  setOpt('fManigliaColore',   p.maniglia_colore_mat);

  // CTL: carica prima i valori dal DB, poi applica le restrizioni per tipo_porta.
  // Ordine obbligatorio: sc() prima, aggiornaCTL() dopo.
  // Se il DB aveva dati incoerenti (es. tipo=INT con ctl_bli=true),
  // aggiornaCTL() li azzera nell'UI. Al salvataggio verranno scritti false su Supabase.
  sc('fFornCTLInt', p.fornitura_ctl_int);
  sc('fFornCTLBli', p.fornitura_ctl_bli);
  sc('fFornCTLRei', p.fornitura_ctl_rei);
  sc('fInstCTLInt', p.install_ctl_int);
  sc('fInstCTLBli', p.install_ctl_bli);
  sc('fInstCTLRei', p.install_ctl_rei);
  // 1B FIX: applica restrizioni CTL DOPO aver caricato i valori
  aggiornaCTL();

  sc('fVetri',    p.vetri);
  sc('fMostrine', p.mostrine);

  ricalcola();
  _dirty = false;
}

// ── RACCOLTA DATI (solo campi esistenti in posizioni_porte) ──
function raccogliDati() {
  // 1B FIX: i campi CTL vengono filtrati in base al tipo_porta.
  // Solo i 2 CTL coerenti con il tipo selezionato possono essere true.
  // Protezione doppia: UI (disabled+unchecked) + payload (esplicitamente false).
  var tipoP = gv('fTipoPorta') || '';

  return Object.assign({}, _rec, {
    numero_pos:           isNew ? _nextNumPos : (_rec.numero_pos || null),
    ordine:               isNew ? (_nextNumPos * 10) : (_rec.ordine || null),
    numero_pos_alfa:      (gv('fNumAlfa') || '').toUpperCase().trim() || null,
    piano:                (function(){ var v = document.getElementById('fPiano').value; return v !== '' ? parseInt(v) : null; })(),
    ambiente:             gv('fAmbiente'),
    tipo_porta:           gv('fTipoPorta'),
    tipo_foro:            gv('fTipoForo'),
    l_mm:                 parseInt(document.getElementById('fLmm').value) || null,
    h_mm:                 parseInt(document.getElementById('fHmm').value) || null,
    sp_muro_mm:           parseInt(document.getElementById('fSpMuro').value) || null,
    telaio_decentrato_mm: parseInt(document.getElementById('fDecentrato').value) || null,
    sopraluce:            gb('fSopraluce'),
    rimozione:            gb('fRimozione'),
    allargamento_telaio:  gb('fAllargamento'),
    allargamento_mm:      gb('fAllargamento') ? (parseInt(document.getElementById('fAllargamentoMm').value) || null) : null,
    fornitore:            gv('fFornitore'),
    sistema:              gv('fSistema'),
    collezione:           gv('fCollezione'),
    modello:              gv('fModello'),
    versione_porta:       gv('fVersione'),
    essenza:              gv('fEssenza'),
    verso_apertura:       gv('fVerso'),
    tipo_serratura:       gv('fTipoSerratura'),
    colore_serratura:     gv('fColoreSerratura'),
    colore_cerniere:      gv('fColoreCerniere'),
    maniglia_marca:       gv('fManigliaMarca'),
    maniglia_modello:     gv('fManigliaModello'),
    maniglia_colore_mat:  gv('fManigliaColore'),
    // 1B FIX: CTL filtrati per tipo_porta — false esplicito per i campi non coerenti
    fornitura_ctl_int:    tipoP === 'INT' ? gb('fFornCTLInt') : false,
    fornitura_ctl_bli:    tipoP === 'BLI' ? gb('fFornCTLBli') : false,
    fornitura_ctl_rei:    tipoP === 'REI' ? gb('fFornCTLRei') : false,
    install_ctl_int:      tipoP === 'INT' ? gb('fInstCTLInt')  : false,
    install_ctl_bli:      tipoP === 'BLI' ? gb('fInstCTLBli')  : false,
    install_ctl_rei:      tipoP === 'REI' ? gb('fInstCTLRei')  : false,
    vetri:                gb('fVetri'),
    mostrine:             gb('fMostrine'),
    note:                 gv('fNote'),
    stato:                'attivo'
  });
}

// ── VALIDAZIONE ──
function valida() {
  var errs = [];
  if (!document.getElementById('fTipoPorta').value) errs.push('Tipo porta obbligatorio');
  if (!document.getElementById('fTipoForo').value)  errs.push('Tipo foro obbligatorio');
  if (!document.getElementById('fLmm').value)       errs.push('L foro obbligatorio');
  if (!document.getElementById('fHmm').value)       errs.push('H foro obbligatorio');
  if (!document.getElementById('fFornitore').value) errs.push('Fornitore obbligatorio');
  return errs;
}

// ── SALVA ──
function salva() {
  var errs = valida();
  if (errs.length) { alert('Campi obbligatori:\n' + errs.join('\n')); return; }
  var data = raccogliDati();
  var op   = isNew ? 'insert' : 'update';
  var btn  = document.querySelector('[onclick="salva()"]');
  if (btn) { btn.disabled = true; btn.textContent = 'Salvataggio...'; }
  API.savePosizione('posizioni_porte', op, data, isNew ? null : _loadedAt, function(err, saved, conflict){
    if (btn) { btn.disabled = false; btn.innerHTML = '&#128190; Salva posizione'; }
    if (conflict) { document.getElementById('conflictBanner').style.display = 'block'; document.getElementById('formWrap').scrollTo(0,0); return; }
    if (err && err !== 'conflict') { alert('Errore: ' + err); return; }
    _dirty = false;
    API.miniSync('posizioni_porte', function(){
      window.location.replace('rilievo-porte.html?id=' + idRilievo);
    });
  });
}

function forceOverwrite() {
  document.getElementById('conflictBanner').style.display = 'none';
  API.savePosizione('posizioni_porte', 'update', raccogliDati(), null, function(err){
    if (err) { alert('Errore: ' + err); return; }
    _dirty = false;
    window.location.replace('rilievo-porte.html?id=' + idRilievo);
  });
}

function reloadRecord() {
  document.getElementById('conflictBanner').style.display = 'none';
  window.location.replace('pos-porte-edit.html?id_rilievo=' + idRilievo + '&id=' + idPos);
}

function confirmBack() {
  if (_dirty && !confirm('Hai modifiche non salvate. Vuoi uscire?')) return;
  window.location.replace('rilievo-porte.html?id=' + idRilievo);
}

window.addEventListener('beforeunload', function(e){ if (_dirty){ e.preventDefault(); e.returnValue=''; } });
load();
</script>
