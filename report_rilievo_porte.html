<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Report Rilievo Porte &mdash; F4 Rilievi</title>
  <style>
    body { background: #f5f6fa; font-size: 12px; }
    #toolbar {
      background: #E65100; color: #fff; padding: 10px 18px;
      display: flex; align-items: center; gap: 8px;
      position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 6px rgba(0,0,0,.25);
    }
    #toolbar h1 { font-size: 14px; margin: 0; flex: 1; font-weight: 600; }
    .btn-tb { border: none; border-radius: 6px; padding: 6px 13px; font-size: 12px; font-weight: 600; cursor: pointer; color: #fff; }
    .btn-tb-primary { background: rgba(255,255,255,.25); } .btn-tb-primary:hover { background: rgba(255,255,255,.35); }
    .btn-tb-neutral { background: rgba(0,0,0,.2); } .btn-tb-neutral:hover { background: rgba(0,0,0,.3); }
    #wrap { max-width: 1200px; margin: 20px auto; padding: 0 14px 48px; }
    #stato-msg { text-align: center; padding: 80px; color: #6b7280; }
    .scheda-hdr { background: #fff; border: 2px solid #E65100; border-radius: 8px; margin-bottom: 10px; overflow: hidden; page-break-inside: avoid; }
    .sh-top { display: grid; grid-template-columns: 110px 1fr 220px; border-bottom: 2px solid #E65100; }
    .sh-logo { background: #E65100; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; font-size: 10px; font-weight: 700; text-align: center; }
    .sh-logo .lb { border: 2px solid #fff; padding: 3px 8px; font-size: 16px; font-weight: 900; letter-spacing: -1px; margin-bottom: 3px; }
    .sh-c { padding: 10px 14px; border-left: 2px solid #E65100; border-right: 2px solid #E65100; }
    .sh-d { padding: 10px 12px; }
    .sh-f { display: flex; align-items: baseline; gap: 6px; margin-bottom: 4px; font-size: 11px; }
    .sh-f label { font-weight: 700; color: #E65100; font-size: 10px; min-width: 68px; white-space: nowrap; }
    .sh-f span { color: #374151; border-bottom: 1px solid #d1d5db; flex: 1; min-height: 13px; }
    .sh-badges { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
    .sh-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 700; }
    .sh-badge.orange { background: #fff3e0; color: #E65100; }
    .sh-badge.green { background: #d1fae5; color: #065f46; }
    .note-generali-bar { background: #fffbeb; border-left: 4px solid #f59e0b; padding: 6px 10px 7px; font-size: 10px; border-top: 1px solid #fde68a; }
    .sez-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: #E65100; margin: 14px 0 8px; padding-bottom: 3px; border-bottom: 2px solid #ffe0cc; }
    .leg-block { background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; padding: 8px 12px; margin-bottom: 10px; page-break-inside: avoid; }
    .leg-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .leg-sec h4 { font-size: 9px; font-weight: 700; color: #E65100; margin: 0 0 3px; text-transform: uppercase; }
    .leg-row { font-size: 9px; line-height: 1.5; }
    .leg-row b { color: #E65100; margin-right: 3px; font-family: monospace; }
    .chk { display: inline-block; width: 10px; height: 10px; border: 1.5px solid #9ca3af; border-radius: 2px; background: #fff; }
    .chk.on { background: #E65100; border-color: #E65100; }
    .tbl-outer { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; overflow-x: auto; margin-bottom: 10px; }
    table.t-pos { border-collapse: collapse; width: 100%; font-size: 11px; white-space: nowrap; }
    table.t-pos thead tr.th-g th { background: #6b3a1f; color: #ffd5b8; padding: 3px 5px; text-align: center; font-size: 9px; font-weight: 700; text-transform: uppercase; border-right: 1px solid #854a2a; }
    table.t-pos thead tr.th-m th { background: #E65100; color: #fff; padding: 6px 6px; text-align: center; font-size: 10px; font-weight: 600; border-right: 1px solid #bf4500; }
    table.t-pos td { padding: 4px 6px; border-bottom: 1px solid #f0f0f6; border-right: 1px solid #f5f5f5; font-size: 10px; color: #374151; }
    table.t-pos tr:nth-child(even) td { background: #fff8f5; }
    table.t-pos tr { page-break-inside: avoid; }
    table.t-pos td.num { font-weight: 700; color: #E65100; font-family: monospace; background: #fff3e0 !important; text-align: center; }
    table.t-pos td.c { text-align: center; }
    table.t-pos td.gsep { border-left: 2px solid #e5e7eb; }
    .badge-tipo-p { display: inline-block; padding: 1px 6px; border-radius: 10px; background: #fff3e0; color: #E65100; font-weight: 700; font-size: 10px; }
    .tot-bar { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
    .tot-chip { background: #fff3e0; color: #E65100; border-radius: 10px; padding: 2px 8px; font-size: 10px; font-weight: 600; }
    .tr-cap-hdr td { background: #E65100; color: #fff3e0; font-weight: 700; font-size: 9px; letter-spacing: 1px; text-transform: uppercase; padding: 5px 8px; border-top: 3px solid #bf4500; page-break-after: avoid; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .tr-cap-subtot td { background: #fff3e0; color: #bf4500; font-size: 8px; font-weight: 600; padding: 3px 8px; border-bottom: 2px solid #ffccaa; page-break-before: avoid; }
    .tr-cap-end td { background: #fff8f5; color: #9ca3af; font-size: 7.5px; padding: 2px 8px; border-bottom: 1px solid #e5e7eb; }
    .tr-no-cap td { background: #fafafa; color: #6b7280; font-size: 8px; font-weight: 600; padding: 3px 8px; border-top: 2px solid #e5e7eb; }
    @media print {
      @page { size: A4 landscape; margin: 7mm; }
      body { background: #fff; }
      #toolbar { display: none !important; }
      #wrap { margin: 0; padding: 0; max-width: none; }
      .scheda-hdr { border-radius: 0; margin-bottom: 4px; }
      .sh-top { grid-template-columns: 90px 1fr 190px; }
      .sh-logo .lb { font-size: 12px; }
      .sh-f { font-size: 9px; margin-bottom: 2px; }
      .sh-f label { font-size: 9px; }
      .note-generali-bar { font-size: 9px; padding: 4px 8px; }
      .leg-block { border-radius: 0; padding: 5px 8px; }
      .tbl-outer { border-radius: 0; overflow: visible; }
      table.t-pos { font-size: 8px; white-space: normal; }
      table.t-pos thead tr.th-g th { padding: 2px 3px; font-size: 7px; }
      table.t-pos thead tr.th-m th { padding: 3px 4px; font-size: 8px; }
      table.t-pos td { padding: 2px 4px; font-size: 8px; }
      .tr-cap-hdr td { font-size: 8px; padding: 3px 6px; }
      .tr-cap-subtot td { font-size: 7px; padding: 2px 6px; }
    }
  </style>
</head>
<body>
<div id="toolbar">
  <h1 id="tb-titolo">Report Rilievo Porte</h1>
  <button class="btn-tb btn-tb-neutral" onclick="history.back()">&#8592; Indietro</button>
  <button class="btn-tb btn-tb-primary" onclick="window.print()">&#128438; Stampa A4</button>
</div>
<div id="wrap">
  <div id="stato-msg">Caricamento&hellip;</div>
  <div id="rep-content" style="display:none"></div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
var currentUser = Auth.requireLogin(); if (!currentUser) throw new Error('not logged');
var idRilievo = (new URLSearchParams(window.location.search)).get('idRilievo') ||
                (new URLSearchParams(window.location.search)).get('id');
if (!idRilievo) history.back();

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function v(x){ return (!x&&x!==0)?'':String(x); }
function chk(val){ return val===true||val==='SI'?'<span class="chk on"></span>':'<span class="chk"></span>'; }
function numPos(p){ return p.numero_pos_alfa||p.numero_pos; }

var SUPA_URL=APP_CONFIG.SUPABASE_URL, SUPA_KEY=APP_CONFIG.SUPABASE_ANON_KEY;
function sfetch(path,cb,eb){
  var x=new XMLHttpRequest();x.open('GET',SUPA_URL+'/rest/v1/'+path,true);
  x.setRequestHeader('apikey',SUPA_KEY);
  x.setRequestHeader('Authorization','Bearer '+(Auth.getToken()||SUPA_KEY));
  x.onload=function(){if(x.status>=200&&x.status<300){try{cb(JSON.parse(x.responseText));}catch(e){if(eb)eb(e);}}else{if(eb)eb('HTTP '+x.status);}};
  x.onerror=function(){if(eb)eb('Rete');};x.send();
}

var loaded={ril:null,pos:null,caps:null};
var done=0,tot=3,errored=false;

function tryRender(){
  done++;
  if(done<tot||errored)return;
  render(loaded.ril,loaded.pos,loaded.caps);
}

sfetch(
  'rilievi?id=eq.'+idRilievo+
  '&select=id,codice_completo,referente,data_rilievo,data_posa,intervento,note_generali,' +
  'cantieri(nome_cantiere,tipo_via,indirizzo,comune,provincia,cap,clienti(nome,telefono,email))',
  function(r){if(!r||!r.length){errored=true;document.getElementById('stato-msg').textContent='Rilievo non trovato.';return;}loaded.ril=r[0];tryRender();},
  function(){errored=true;document.getElementById('stato-msg').textContent='Errore caricamento rilievo.';}
);
sfetch(
  'posizioni_porte?id_rilievo=eq.'+idRilievo+'&stato=eq.attivo&select=*&order=ordine.asc',
  function(r){loaded.pos=r||[];tryRender();},
  function(){loaded.pos=[];tryRender();}
);
sfetch(
  'capitoli_rilievo?id_rilievo=eq.'+idRilievo+'&stato=eq.attivo&select=*&order=ordine_inizio.asc',
  function(r){loaded.caps=r||[];tryRender();},
  function(){loaded.caps=[];tryRender();}
);

function render(ril,pos,caps){
  var cp=ril.cantieri||{},cli=cp.clienti||{};
  var codice=ril.codice_completo||idRilievo;
  document.getElementById('tb-titolo').textContent='Rilievo Porte '+codice;
  document.title='Rilievo Porte '+codice;
  var html='';

  // ── HEADER ──
  var locStr=((cp.tipo_via||'')+' '+(cp.indirizzo||'')).trim();
  var comuneStr=[cp.comune,cp.provincia?'('+cp.provincia+')':'',cp.cap].filter(Boolean).join(' ');
  html+='<div class="scheda-hdr"><div class="sh-top">';
  html+='<div class="sh-logo"><div class="lb">[F4]</div>GRUPPO F4<div style="font-size:8px;opacity:.8;margin-top:2px">F4 Rilievi</div></div>';
  html+='<div class="sh-c">';
  html+='<div class="sh-f"><label>Riferimento:</label><span>'+(cli.nome?esc(cli.nome)+' &mdash; ':'')+esc(cp.nome_cantiere||'—')+'</span>'+
    '<span style="margin-left:8px;font-size:10px;font-weight:700;color:#E65100;background:#fff3e0;padding:1px 7px;border-radius:8px;flex:none">'+esc(codice)+'</span></div>';
  html+='<div class="sh-f"><label>Indirizzo:</label><span>'+esc(locStr||'—')+'</span></div>';
  html+='<div class="sh-f"><label>Comune:</label><span>'+esc(comuneStr||'—')+'</span></div>';
  html+='<div class="sh-f"><label>Tel / e-mail:</label><span>'+esc([cli.telefono,cli.email].filter(Boolean).join(' \u2014 ')||'—')+'</span></div>';
  html+='</div><div class="sh-d">';
  html+='<div class="sh-f"><label>Intervento:</label><span>'+esc(ril.intervento||'—')+'</span></div>';
  html+='<div class="sh-f"><label>Referente:</label><span>'+esc(ril.referente||'—')+'</span></div>';
  html+='<div class="sh-f"><label>Data rilievo:</label><span>'+esc(ril.data_rilievo||'—')+'</span></div>';
  html+='<div class="sh-f"><label>Data posa:</label><span>'+esc(ril.data_posa||'—')+'</span></div>';
  html+='<div class="sh-badges"><span class="sh-badge orange">PORTE INTERNE</span><span class="sh-badge green">'+pos.length+' pos.</span></div>';
  html+='</div></div>';
  if(ril.note_generali&&ril.note_generali.trim()){
    html+='<div class="note-generali-bar"><strong style="color:#92400e;">&#128221; Note generali:</strong> <span style="color:#78350f;">'+esc(ril.note_generali)+'</span></div>';
  }
  html+='</div>';

  // ── LEGENDA ──
  html+='<div class="leg-block"><div class="leg-grid">';
  html+='<div class="leg-sec"><h4>Tipo porta</h4><div class="leg-row"><b>INT</b>Porta interna</div><div class="leg-row"><b>BLI</b>Porta blindata</div><div class="leg-row"><b>REI</b>Porta REI</div></div>';
  html+='<div class="leg-sec"><h4>Sistema</h4><div class="leg-row"><b>ST</b>Standard</div><div class="leg-row"><b>SC</b>Scorrevole est.</div><div class="leg-row"><b>SI</b>Scorrevole int.</div><div class="leg-row"><b>DO</b>Doppia</div><div class="leg-row"><b>LI</b>A libro</div><div class="leg-row"><b>PI</b>Pivot</div><div class="leg-row"><b>TP</b>T.passaggio</div><div class="leg-row"><b>FC</b>F+CTL</div><div class="leg-row"><b>F_</b>Solo filo</div></div>';
  html+='<div class="leg-sec"><h4>Tipo foro</h4><div class="leg-row"><b>N</b>Netta passaggio</div><div class="leg-row"><b>P</b>Posa in luce</div><h4 style="margin-top:5px">CTL</h4><div class="leg-row"><b>FI</b>Forn. int.</div><div class="leg-row"><b>FB</b>Forn. bli.</div><div class="leg-row"><b>FR</b>Forn. REI</div><div class="leg-row"><b>II</b>Inst. int.</div><div class="leg-row"><b>IB</b>Inst. bli.</div><div class="leg-row"><b>IR</b>Inst. REI</div></div>';
  html+='<div class="leg-sec"><h4>Flag</h4><div class="leg-row"><span class="chk on"></span> = attivo</div><div class="leg-row"><span class="chk"></span> = assente</div><h4 style="margin-top:5px">Allarg.</h4><div class="leg-row"><b>ALL</b>Allargamento telaio</div><h4 style="margin-top:5px">Rim.</h4><div class="leg-row"><b>RIM</b>Rimozione porta</div></div>';
  html+='<div class="leg-sec"><h4>Capitoli</h4><div class="leg-row">&#9552;&#9552;&#9552; = Inizio capitolo</div><div class="leg-row">Subtotale dopo ogni capitolo</div><div class="leg-row">&#9472;&#9472;&#9472; = Fine capitolo</div></div>';
  html+='</div></div>';

  // ── TOTALI PER TIPO ──
  var ct={};pos.forEach(function(p){var t=p.tipo_porta||'—';ct[t]=(ct[t]||0)+1;});
  if(Object.keys(ct).length){
    html+='<div class="tot-bar">';
    Object.keys(ct).sort().forEach(function(t){html+='<span class="tot-chip"><span class="badge-tipo-p">'+t+'</span> '+ct[t]+' pos.</span>';});
    html+='</div>';
  }

  // ── TABELLA POSIZIONI ──
  var NCOL=17;
  html+='<div class="tbl-outer"><table class="t-pos"><thead>';
  html+='<tr class="th-g">'+
    '<th colspan="4">IDENTIFICAZIONE</th>'+
    '<th colspan="3" class="gsep">FORO / DIM.</th>'+
    '<th colspan="3" class="gsep">SISTEMA</th>'+
    '<th colspan="3" class="gsep">CARATTERISTICHE</th>'+
    '<th colspan="4" class="gsep">POSA / FLAG</th>'+
    '</tr>';
  html+='<tr class="th-m">'+
    '<th>N&#176;</th><th>Piano</th><th>Ambiente</th><th>Tipo</th>'+
    '<th class="gsep">Foro</th><th>H (mm)</th><th>L (mm)</th>'+
    '<th class="gsep">Fornitore</th><th>Sistema</th><th>Sopraluce</th>'+
    '<th class="gsep">Modello</th><th>Essenza</th><th>Verso</th>'+
    '<th class="gsep c">ALL</th><th class="c">CTL</th><th class="c">RIM</th><th>Note</th>'+
    '</tr></thead><tbody>';

  function rowPos(p){
    var piano=(p.piano!==undefined&&p.piano!==null)?('P'+(parseInt(p.piano)>=0?'+':'')+p.piano):'—';
    var numDisp=p.numero_pos_alfa||p.numero_pos;
    var ctlForn=[p.fornitura_ctl_int==='SI'?'FI':'',p.fornitura_ctl_bli==='SI'?'FB':'',p.fornitura_ctl_rei==='SI'?'FR':''].filter(Boolean).join(' ');
    var ctlInst=[p.install_ctl_int==='SI'?'II':'',p.install_ctl_bli==='SI'?'IB':'',p.install_ctl_rei==='SI'?'IR':''].filter(Boolean).join(' ');
    var ctlStr=[ctlForn,ctlInst].filter(Boolean).join(' / ')||'—';
    var h='<tr>';
    h+='<td class="num">'+esc(v(numDisp))+'</td>';
    h+='<td class="c">'+piano+'</td>';
    h+='<td style="white-space:normal;min-width:55px">'+esc(v(p.ambiente))+'</td>';
    h+='<td class="c"><span class="badge-tipo-p">'+esc(v(p.tipo_porta))+'</span></td>';
    h+='<td class="c gsep">'+esc(v(p.tipo_foro))+'</td>';
    h+='<td class="c">'+esc(v(p.h_mm||p.H_mm))+'</td>';
    h+='<td class="c">'+esc(v(p.l_mm||p.L_mm))+'</td>';
    h+='<td class="gsep" style="font-size:9px;">'+esc(v(p.fornitore))+'</td>';
    h+='<td style="font-size:9px;">'+esc(v(p.sistema))+'</td>';
    h+='<td class="c">'+chk(p.sopraluce==='SI'||p.sopraluce===true)+'</td>';
    h+='<td class="gsep" style="white-space:normal;min-width:55px;font-size:9px;">'+esc(v(p.modello))+'</td>';
    h+='<td style="white-space:normal;min-width:50px;font-size:9px;">'+esc(v(p.essenza))+'</td>';
    h+='<td style="font-size:9px;">'+esc(v(p.verso_apertura))+'</td>';
    h+='<td class="c gsep">'+chk(p.allargamento_telaio)+'</td>';
    h+='<td class="c" style="font-size:8px;">'+esc(ctlStr)+'</td>';
    h+='<td class="c">'+chk(p.rimozione==='SI'||p.rimozione===true)+'</td>';
    h+='<td style="white-space:normal;min-width:60px;font-size:9px;">'+esc(v(p.note))+'</td>';
    h+='</tr>';
    return h;
  }

  function rowSubtot(titolo,posCap){
    var nP=posCap.length,nRim=0,nAll=0,tipiMap={},nCTLFI=0,nCTLII=0;
    posCap.forEach(function(p){
      if(p.rimozione==='SI'||p.rimozione===true)nRim++;
      if(p.allargamento_telaio==='SI'||p.allargamento_telaio===true)nAll++;
      if(p.fornitura_ctl_int==='SI')nCTLFI++;
      if(p.install_ctl_int==='SI')nCTLII++;
      var t=p.tipo_porta||'—';tipiMap[t]=(tipiMap[t]||0)+1;
    });
    var chips='<b>'+nP+'</b> pos.';
    Object.keys(tipiMap).sort().forEach(function(t){chips+=' &#9642; '+t+': <b>'+tipiMap[t]+'</b>';});
    if(nRim)  chips+=' &#9642; Rim: <b>'+nRim+'</b>';
    if(nAll)  chips+=' &#9642; Allarg: <b>'+nAll+'</b>';
    if(nCTLFI)chips+=' &#9642; CTL-FI: <b>'+nCTLFI+'</b>';
    if(nCTLII)chips+=' &#9642; CTL-II: <b>'+nCTLII+'</b>';
    return '<tr class="tr-cap-subtot"><td colspan="'+NCOL+'">Subtotale &mdash; '+esc(titolo)+' &nbsp;&#124; '+chips+'</td></tr>';
  }

  // costruisci righe con capitoli
  var righe=[];
  pos.forEach(function(p){var ord=(p.ordine!==undefined&&p.ordine!==null)?p.ordine:p.numero_pos;righe.push({tipo:'pos',ordine:ord,data:p});});
  (caps||[]).forEach(function(cap){righe.push({tipo:'cap_inizio',ordine:cap.ordine_inizio,data:cap});righe.push({tipo:'cap_fine',ordine:cap.ordine_fine,data:cap});});
  righe.sort(function(a,b){return a.ordine-b.ordine;});

  var capCorr=null,posCap=[],posiFuori=[];
  righe.forEach(function(r){
    if(r.tipo==='cap_inizio'){
      if(posiFuori.length){
        html+='<tr class="tr-no-cap"><td colspan="'+NCOL+'">Posizioni senza capitolo ('+posiFuori.length+')</td></tr>';
        posiFuori.forEach(function(p){html+=rowPos(p);});posiFuori=[];
      }
      capCorr=r.data;posCap=[];
      html+='<tr class="tr-cap-hdr"><td colspan="'+NCOL+'">\u2550\u2550\u2550 '+esc(r.data.titolo)+' \u2550\u2550\u2550</td></tr>';
    }else if(r.tipo==='cap_fine'){
      posCap.forEach(function(p){html+=rowPos(p);});
      if(posCap.length)html+=rowSubtot(capCorr?capCorr.titolo:'',posCap);
      html+='<tr class="tr-cap-end"><td colspan="'+NCOL+'">\u2500\u2500\u2500 Fine: '+esc(r.data.titolo)+' \u2500\u2500\u2500</td></tr>';
      capCorr=null;posCap=[];
    }else{
      if(capCorr)posCap.push(r.data);else posiFuori.push(r.data);
    }
  });
  if(posiFuori.length){
    if(caps&&caps.length)html+='<tr class="tr-no-cap"><td colspan="'+NCOL+'">Posizioni senza capitolo ('+posiFuori.length+')</td></tr>';
    posiFuori.forEach(function(p){html+=rowPos(p);});
  }
  html+='</tbody></table></div>';

  document.getElementById('stato-msg').style.display='none';
  document.getElementById('rep-content').style.display='';
  document.getElementById('rep-content').innerHTML=html;
}
</script>
</body>
</html>
