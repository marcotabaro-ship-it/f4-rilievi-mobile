<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <title>Rilievo — F4 Rilievi</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/mobile.css"/>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#1a1a2e"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <style>
    .pos-row { display:flex; align-items:center; gap:10px; padding:11px 14px; border-top:1px solid var(--c-border); cursor:pointer; -webkit-tap-highlight-color:transparent; }
    .pos-row:active { background:var(--c-bg); }
    .pos-num { width:34px; height:34px; border-radius:8px; background:var(--c-primary); color:#fff; font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; flex-direction:column; gap:1px; }
    .pos-num .acc-lbl { font-size:7px; background:#fef3c7; color:#92400e; border-radius:3px; padding:0 2px; font-weight:700; }
    .pos-body { flex:1; min-width:0; }
    .pos-tipo { font-size:11px; font-weight:700; color:var(--c-accent); }
    .pos-dim  { font-size:13px; font-weight:600; color:var(--c-text); }
    .pos-dim-calc { font-size:11px; color:var(--c-accent); font-style:italic; }
    .pos-sis  { font-size:11px; color:var(--c-text-sec); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
    .pos-acc  { display:flex; flex-wrap:wrap; gap:3px; margin-top:4px; }
    .pos-azioni { display:flex; flex-direction:column; gap:4px; flex-shrink:0; }
    .pos-btn-copia, .pos-btn-elim { display:flex; align-items:center; justify-content:center; width:40px; height:40px; border:none; border-radius:8px; cursor:pointer; font-size:17px; line-height:1; padding:0; -webkit-tap-highlight-color:transparent; }
    .pos-btn-copia { background:#e0f2fe; color:#0369a1; }
    .pos-btn-copia:active { background:#bae6fd; }
    .pos-btn-elim  { background:#fee2e2; color:#dc2626; }
    .pos-btn-elim:active  { background:#fecaca; }
    /* ── Fase 5B-R2 — Drag handle e SortableJS ── */
    .pos-drag-handle { display:flex; align-items:center; justify-content:center; width:28px; height:40px; flex-shrink:0; color:var(--c-text-ter,#9ca3af); font-size:18px; cursor:grab; -webkit-tap-highlight-color:transparent; touch-action:none; user-select:none; }
    .pos-drag-handle:active { cursor:grabbing; }
    .sortable-zone { min-height:52px; border-radius:var(--radius,10px); margin-bottom:0; }
    .sortable-zone.drop-target { outline:2px dashed var(--c-primary,#1a1a2e); outline-offset:-2px; }
    .zona-hdr { background:var(--c-primary); color:#a5b4fc; font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; padding:7px 14px; display:flex; align-items:center; justify-content:space-between; border-radius:var(--radius,10px) var(--radius,10px) 0 0; }
    .zona-placeholder { padding:12px 14px; font-size:11px; color:var(--c-text-ter,#9ca3af); font-style:italic; text-align:center; }
    .pos-row-ghost   { opacity:.4; background:var(--c-bg,#f5f6fa); }
    .pos-row-chosen  { box-shadow:0 4px 16px rgba(0,0,0,.15); }
    .pos-row-dragging{ opacity:.9; }
    .cap-hdr  { background:var(--c-primary); color:#a5b4fc; font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; padding:7px 14px; display:flex; align-items:center; justify-content:space-between; }
    .cap-sub  { background:#eef2ff; border-bottom:2px solid #c7d2fe; padding:5px 14px; font-size:11px; color:#3730a3; font-weight:600; }
    .det-sec  { margin-bottom:16px; }
    .det-sec-title { font-size:10px; font-weight:700; color:var(--c-accent); text-transform:uppercase; letter-spacing:.5px; border-bottom:2px solid var(--c-border); padding-bottom:4px; margin-bottom:10px; }
    .det-row  { display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid #f5f5ff; font-size:13px; }
    .det-row:last-child { border-bottom:none; }
    .det-lbl  { color:var(--c-text-sec); font-size:12px; }
    .det-val  { font-weight:600; color:var(--c-text); text-align:right; max-width:60%; }
    .det-val.calc { color:var(--c-accent); font-style:italic; }
    .btn-del-sheet { flex:0 0 auto; padding:14px 16px; background:#fee2e2; color:#dc2626; border:2px solid #fca5a5; border-radius:10px; font-size:18px; font-weight:700; cursor:pointer; font-family:inherit; line-height:1; }
    .btn-del-sheet:active { background:#fecaca; }

    /* ── C65/C128 — Barra navigazione report serramenti ── */
    .report-nav { display:flex; gap:8px; padding:10px 14px 8px; overflow-x:auto; -webkit-overflow-scrolling:touch; background:var(--c-surface,#fff); border-bottom:1px solid var(--c-border,#e5e7eb); }
    .report-nav::-webkit-scrollbar { display:none; }
    .report-nav-btn { flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 14px; background:#eef2ff; border:1.5px solid #c7d2fe; border-radius:10px; cursor:pointer; font-family:inherit; -webkit-tap-highlight-color:transparent; text-decoration:none; }
    .report-nav-btn:active { background:#e0e7ff; border-color:#a5b4fc; }
    .report-nav-btn .rn-ico { font-size:18px; line-height:1; }
    .report-nav-btn .rn-lbl { font-size:10px; font-weight:700; color:#3730a3; white-space:nowrap; }
  </style>
</head>
<body>

<div class="top-bar">
  <button class="top-bar-btn" onclick="history.back()">&#8592;</button>
  <div style="flex:1;min-width:0;">
    <div class="top-bar-title" id="tbCodice">Rilievo</div>
    <div style="font-size:11px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" id="tbSub">—</div>
  </div>
  <div class="top-bar-actions">
    <button class="top-bar-btn" onclick="apriStratigrafie()" title="Stratigrafie" style="font-size:15px;">&#9776;</button>
    <button class="top-bar-btn" onclick="apriCapitoli()" title="Capitoli" style="font-size:15px;">&#128218;</button>
    <button class="top-bar-btn" onclick="apriModificaRilievo()" title="Modifica rilievo" style="font-size:16px;">&#9998;</button>
    <div class="top-bar-online" id="onlineIndicator" title=""></div>
    <div class="top-bar-avatar" id="userAvatar">TM</div>
  </div>
</div>

<div style="position:fixed;top:56px;bottom:0;left:0;right:0;overflow-y:auto;-webkit-overflow-scrolling:touch;" id="mainWrap">

  <div id="cardRilievo" style="background:var(--c-primary);color:#fff;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;">
    <div style="flex:1;">
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;" id="rilBadges"></div>
      <div style="font-size:12px;opacity:.7;" id="rilInfo">—</div>
    </div>
    <div id="rilNPos" style="background:rgba(255,255,255,.15);border-radius:8px;padding:6px 10px;text-align:center;flex-shrink:0;">
      <div style="font-size:18px;font-weight:700;" id="rilNPosN">—</div>
      <div style="font-size:10px;opacity:.7;">pos.</div>
    </div>
  </div>

  <!-- ── C65/C128 — Navigazione report serramenti ── -->
  <div class="report-nav">
    <button class="report-nav-btn" onclick="window.location.href='report_rilievo.html?id='+idRilievo">
      <span class="rn-ico">&#128196;</span>
      <span class="rn-lbl">Report rilievo</span>
    </button>
    <button class="report-nav-btn" onclick="window.location.href='report_acc.html?id='+idRilievo">
      <span class="rn-ico">&#128202;</span>
      <span class="rn-lbl">Report accessori</span>
    </button>
    <button class="report-nav-btn" onclick="window.location.href='report_posa.html?id='+idRilievo">
      <span class="rn-ico">&#9201;</span>
      <span class="rn-lbl">Report posa</span>
    </button>
    <button class="report-nav-btn" onclick="window.location.href='stampa_combinata.html?id='+idRilievo">
      <span class="rn-ico">&#128438;</span>
      <span class="rn-lbl">Stampa combinata</span>
    </button>
  </div>
  <!-- ── fine navigazione report ── -->

  <div class="filter-row" style="padding:10px 14px 6px;margin-bottom:0;">
    <button class="filter-chip active" onclick="setFiltro('tutti',this)">Tutti</button>
    <button class="filter-chip" onclick="setFiltro('I',this)">I</button>
    <button class="filter-chip" onclick="setFiltro('F',this)">F</button>
    <button class="filter-chip" onclick="setFiltro('PF',this)">PF</button>
    <button class="filter-chip" onclick="setFiltro('FF',this)">FF</button>
    <button class="filter-chip" onclick="setFiltro('VF',this)">VF</button>
    <button class="filter-chip" onclick="setFiltro('S',this)">S</button>
    <button class="filter-chip" style="background:#fef3c7;border-color:#fcd34d;color:#92400e;" onclick="setFiltro('ACC',this)">ACC</button>
  </div>

  <div id="listaPosizioni" style="padding-bottom:24px;">
    <div class="loading-state"><div class="spinner"></div><p>Caricamento...</p></div>
  </div>
</div>

<div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet()"></div>

<div class="bottom-sheet" id="sheetPos">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <div class="sheet-title" id="shTitle">Posizione —</div>
    <button class="sheet-close" onclick="closeSheet()">&#10005;</button>
  </div>
  <div class="sheet-body" id="shBody"></div>
  <div class="sheet-footer" style="display:flex;gap:10px;">
    <button class="btn-del-sheet" onclick="eliminaPosizione()" title="Elimina posizione">&#128465;</button>
    <button class="btn btn-primary btn-full" id="btnModifica" onclick="modificaPosizione()">&#9998; Modifica posizione</button>
  </div>
</div>

<button class="btn-fab" id="fabNuova" onclick="nuovaPosizione()" title="Nuova posizione" style="display:none;">&#43;</button>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/db-local.js"></script>
<script src="js/api-mobile.js"></script>
<script src="js/sortable.min.js"></script>
<script>
var currentUser = Auth.requireLogin();
if (!currentUser) throw new Error('not logged');
document.getElementById('userAvatar').textContent = currentUser.sigla || (currentUser.nome||'U').substring(0,2).toUpperCase();
document.getElementById('onlineIndicator').className = 'top-bar-online' + (API.isOnline()?'':' offline');

var idRilievo = new URLSearchParams(window.location.search).get('id');
if (!idRilievo) { history.back(); }

var _rilievo=null, _posizioni=[], _capitoli=[], _dbSerr=[], _cantiere=null, _clienti=[];
var _filtro='tutti';
// Fase 5B-R2 — SortableJS state
var _sortableInstances=[], _dragInCorso=false, _salvataggioRiordino=false;
function _ord(p){ return (p.ordine!=null)?p.ordine:p.numero_pos; }

function calcTub(p, dbSerr) {
  var H=parseFloat(p.H_mm||p.h_mm)||0, L=parseFloat(p.L_mm||p.l_mm)||0;
  var tf=(p.tipo_foro||'').toUpperCase(), ts=(p.tipo_serramento||'').toUpperCase();
  if (p.solo_accessori) return {Lt:Math.round(L),Ht:Math.round(H)};
  if (!H||!L||!tf) return null;
  var nAlH=(ts==='F'||ts==='FF')?2:1;
  var inclBasso=(ts==='F'||ts==='FF');
  var Lt=0, Ht=0;
  if (p.telaio_misto===true||p.telaio_misto==='true') {
    function getR(sigla){ if(!sigla)return null; for(var i=0;i<dbSerr.length;i++){var d=dbSerr[i];if(d&&d.materiale===p.materiale&&(d.descrizione===p.sistema||d.sistema===p.sistema)&&d.stile_design===p.stile_design&&d.variante_telaio===sigla)return d;} return null; }
    var rA=getR(p.variante_alto),rB=getR(p.variante_basso),rS=getR(p.variante_sx),rD=getR(p.variante_dx);
    var nA=rA?(parseFloat(rA.telaio_nascosto_mm)||0):0;
    var nS=rS?(parseFloat(rS.telaio_nascosto_mm)||0):0, nD=rD?(parseFloat(rD.telaio_nascosto_mm)||0):0;
    var aA=rA?(parseFloat(rA.aletta_mm)||0):0, aB=rB?(parseFloat(rB.aletta_mm)||0):0;
    var aS=rS?(parseFloat(rS.aletta_mm)||0):0, aD=rD?(parseFloat(rD.aletta_mm)||0):0;
    var tvA=rA?(parseFloat(rA.telaio_vista_mm)||0):0;
    var tvS=rS?(parseFloat(rS.telaio_vista_mm)||0):0, tvD=rD?(parseFloat(rD.telaio_vista_mm)||0):0;
    if(tf==='A'){Lt=L+nS+nD+aS+aD; Ht=H+nA+aA+(inclBasso?aB:0);}
    else if(tf==='D'){Lt=L+aS+aD; Ht=H+aA+(inclBasso?aB:0);}
    else if(tf==='P'){Lt=L-tvS-tvD+aS+aD; Ht=H-tvA+aA+(inclBasso?aB:0);}
    return {Lt:Math.round(Lt),Ht:Math.round(Ht)};
  }
  var rec=null;
  for(var i=0;i<dbSerr.length;i++){var d=dbSerr[i];if(d&&d.materiale===p.materiale&&(d.descrizione===p.sistema||d.sistema===p.sistema)&&d.stile_design===p.stile_design&&d.variante_telaio===p.variante_telaio){rec=d;break;}}
  if(!rec){for(var i=0;i<dbSerr.length;i++){var d=dbSerr[i];if(d&&d.materiale===p.materiale&&(d.descrizione===p.sistema||d.sistema===p.sistema)&&d.stile_design===p.stile_design){rec=d;break;}}}
  var na=rec?(parseFloat(rec.telaio_nascosto_mm)||0):0;
  var al=rec?(parseFloat(rec.aletta_mm)||0):0;
  var tv=rec?(parseFloat(rec.telaio_vista_mm)||0):0;
  if(tf==='A'){Lt=L+2*na+2*al; Ht=H+na+nAlH*al;}
  else if(tf==='D'){Lt=L+2*al; Ht=H+nAlH*al;}
  else if(tf==='P'){Lt=L-2*tv+2*al; Ht=H-tv+nAlH*al;}
  return {Lt:Math.round(Lt),Ht:Math.round(Ht)};
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function v(x){ return (x===null||x===undefined)?'':String(x); }

function load() {
  DBLocal.getById('rilievi', idRilievo, function(ril) {
    if (!ril) {
      document.getElementById('listaPosizioni').innerHTML='<div class="empty-state"><div class="empty-ico">&#128196;</div><div class="empty-title">Rilievo non trovato</div><div class="empty-sub">Esegui una sincronizzazione</div></div>';
      return;
    }
    _rilievo = ril;
    document.title = (ril.codice_completo||'Rilievo') + ' — F4 Rilievi';
    document.getElementById('tbCodice').textContent = ril.codice_completo || ril.id.substring(0,8);

    DBLocal.getAll('cantieri', function(ca){
      var cant = ca.find(function(c){ return c.id===ril.id_cantiere; });
      _cantiere = cant;
      DBLocal.getAll('clienti', function(cl){
        _clienti = cl;
        var cli = cant ? cl.find(function(c){ return c.id===cant.id_cliente; }) : null;
        var sub = '';
        if (cli) sub += cli.nome;
        if (cant) sub += (sub?' — ':'')+cant.nome_cantiere;
        document.getElementById('tbSub').textContent = sub || '—';

        var badges = '';
        if (ril.gru==='SI') badges += '<span style="background:rgba(79,70,229,.3);color:#a5b4fc;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;">&#127959; GRU</span> ';
        if (ril.allarme===true) badges += '<span style="background:rgba(220,38,38,.3);color:#fca5a5;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;">&#9888; ALLARME</span> ';
        if (ril.intervento) badges += '<span style="background:rgba(255,255,255,.15);color:#fff;font-size:10px;padding:2px 8px;border-radius:10px;">'+esc(ril.intervento)+'</span>';
        document.getElementById('rilBadges').innerHTML = badges;

        var info = [];
        if (ril.referente) info.push('Ref: '+ril.referente);
        if (ril.data_rilievo) info.push(ril.data_rilievo);
        if (ril.data_posa) info.push('Posa: '+ril.data_posa);
        document.getElementById('rilInfo').textContent = info.join(' · ');

        DBLocal.getAll('posizioni_serr', function(pos){
          _posizioni = pos.filter(function(p){ return p.id_rilievo===idRilievo && p.stato==='attivo'; });
          document.getElementById('rilNPosN').textContent = _posizioni.length;
          DBLocal.getAll('capitoli_rilievo', function(cap){
            _capitoli = cap.filter(function(c){ return c.id_rilievo===idRilievo && c.stato==='attivo'; });
            DBLocal.getAll('db_serramento', function(db){
              _dbSerr = db;
              renderPosizioni();
            });
          });
        });
      });
    });
  });
}

function setFiltro(f, btn) {
  _filtro = f;
  document.querySelectorAll('.filter-chip').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  renderPosizioni();
}

function renderPosizioni() {
  // Distrugge le istanze Sortable esistenti prima di ricostruire il DOM
  _sortableInstances.forEach(function(s){ try{ s.destroy(); }catch(e){} });
  _sortableInstances=[];

  var container = document.getElementById('listaPosizioni');
  var pos = _posizioni.filter(function(p){
    if (_filtro==='tutti') return true;
    if (_filtro==='ACC') return p.solo_accessori===true;
    return (p.tipo_serramento||'').toUpperCase()===_filtro && !p.solo_accessori;
  });

  document.getElementById('fabNuova').style.display = '';

  // Ordina posizioni per _ord
  pos.sort(function(a,b){ return _ord(a)-_ord(b); });

  // Ordina capitoli per ordine_inizio
  var caps = _capitoli.slice().sort(function(a,b){ return a.ordine_inizio-b.ordine_inizio; });

  // Determina la zona di appartenenza di ogni posizione tramite range
  function capIdDiPos(p){
    var o=_ord(p);
    for(var i=0;i<caps.length;i++){
      if(o>caps[i].ordine_inizio&&o<caps[i].ordine_fine) return caps[i].id;
    }
    return '__fuori__';
  }

  // Mappa zona → [posizioni]
  var zoneMap={};
  zoneMap['__fuori__']=[];
  caps.forEach(function(c){ zoneMap[c.id]=[]; });
  pos.forEach(function(p){ zoneMap[capIdDiPos(p)].push(p); });

  // Costruisce HTML per una singola zona
  function buildZone(capId, titolo, posizioniZona, isCapitolo){
    var bordoTop = isCapitolo ? '' : 'border-radius:var(--radius,10px);';
    var z = '<div class="sortable-zone card" data-cap-id="'+capId+'" style="margin-bottom:10px;overflow:hidden;">';
    // Header zona
    z += '<div class="zona-hdr'+(isCapitolo?'':' zona-hdr-fuori')+'">';
    z += '<span>'+esc(titolo)+'</span>';
    z += '<span style="font-size:10px;font-weight:400;opacity:.75;">'+posizioniZona.length+' pos.</span>';
    z += '</div>';
    // Righe posizione
    if(posizioniZona.length){
      posizioniZona.forEach(function(p){ z += renderPosizioneRow(p); });
    } else {
      z += '<div class="zona-placeholder">Nessuna posizione — trascina qui per aggiungere</div>';
    }
    // Subtotale solo per capitoli reali
    if(isCapitolo&&posizioniZona.length){
      z += '<div class="cap-sub">Subtotale '+esc(titolo)+' &mdash; <b>'+posizioniZona.length+'</b> pos.</div>';
    }
    z += '</div>';
    return z;
  }

  var html='';
  // Prima i capitoli in ordine di ordine_inizio
  caps.forEach(function(c){ html+=buildZone(c.id, c.titolo, zoneMap[c.id], true); });
  // Zona fuori capitolo sempre presente (per drop)
  html+=buildZone('__fuori__', 'Senza capitolo', zoneMap['__fuori__'], false);

  container.innerHTML=html;
  document.getElementById('fabNuova').style.display='';

  // Inizializza SortableJS dopo il render
  initSortable();
}

function renderPosizioneRow(p) {
  var tub = calcTub(p, _dbSerr);
  var L=v(p.L_mm||p.l_mm), H=v(p.H_mm||p.h_mm);
  var dimIns = L&&H ? L+' &times; '+H : '—';
  var dimCalc = tub ? Math.round(tub.Lt)+' &times; '+Math.round(tub.Ht) : '';
  var tipoLabel = p.solo_accessori ? 'ACC' : (p.tipo_serramento||'?');
  var pianoStr = p.piano!=null ? ('P'+(p.piano>=0?'+':'')+p.piano) : '—';
  var varStr = '';
  if (p.telaio_misto) { varStr = 'Su('+v(p.variante_alto)+') Giu('+v(p.variante_basso)+') Sx('+v(p.variante_sx)+') Dx('+v(p.variante_dx)+')'; }
  else if (p.variante_telaio) { varStr = p.variante_telaio; }
  var sisStr = p.solo_accessori ? '—' : ([p.sistema, varStr].filter(Boolean).join(' / '));
  var chips = '';
  if (p.controtelaio) chips += '<span class="badge badge-serr" style="font-size:10px;">'+(p.controtelaio==='T'?'TC':'CTL-L')+'</span>';
  if (p.schermatura)  chips += '<span class="badge badge-attivo" style="font-size:10px;">'+esc(p.schermatura)+'</span>';
  if (p.cassonetto)   chips += '<span class="badge" style="background:#fff3e0;color:#E65100;font-size:10px;">Cass</span>';
  if (p.zanzariera)   chips += '<span class="badge" style="background:#d1fae5;color:#065f46;font-size:10px;">Zanz</span>';
  if (p.coprifilo_int_mat) chips += '<span class="badge" style="background:#f3f4f6;color:#374151;font-size:10px;">CopI</span>';
  if (p.coprifilo_est_mat) chips += '<span class="badge" style="background:#f3f4f6;color:#374151;font-size:10px;">CopE</span>';

// ── FASE 5C — COPIA POSIZIONE DA RIGA ──────────────────────────────────────
// Chiede quante copie creare (1-10), poi chiama _eseguiCopia.
// event.stopPropagation() impedisce l'apertura del bottom sheet.
function copiaPosizione(id, event) {
  event.stopPropagation();
  var input = prompt('Quante copie creare? (1\u201310)', '1');
  if (input === null) return;
  // C1 FIX (Fase 5C): validazione stretta — solo interi puri, no decimali, no testo aggiuntivo
  if (!/^\d+$/.test(input.trim())) { alert('Inserire un numero intero da 1 a 10.'); return; }
  var n = parseInt(input.trim(), 10);
  if (n < 1 || n > 10) { alert('Inserire un numero intero da 1 a 10.'); return; }
  _eseguiCopia(id, n);
}

// Esegue N copie sequenziali della posizione sorgente identificata da id.
// Ogni copia: nuovi numero_pos e ordine, id_capitolo=null, numero_pos_alfa=null, stato attivo.
// Gli INSERT vengono eseguiti in serie: ogni call attende il callback prima di procedere.
// _posizioni viene aggiornato in memoria dopo ogni INSERT per mantenere il contatore corretto.
function _eseguiCopia(id, n) {
  var sorgente = _posizioni.find(function(x) { return x.id === id; });
  if (!sorgente) { alert('Posizione non trovata.'); return; }

  var rimasti = n;
  function prossimaInsert() {
    if (rimasti <= 0) {
      // C2 FIX (Fase 5C): aggiorna contatore posizioni alto (rilNPosN) come eliminaPosizione/Row
      document.getElementById('rilNPosN').textContent = _posizioni.length;
      renderPosizioni();
      API.miniSync('posizioni_serr', function() {});
      return;
    }
    // Calcola max numero_pos dalle posizioni attive in memoria (include le copie già inserite)
    var maxNP = 0;
    _posizioni.forEach(function(p) { if ((parseInt(p.numero_pos) || 0) > maxNP) maxNP = parseInt(p.numero_pos) || 0; });
    var nuovoNP = maxNP + 1;
    // Compone il payload: copia tutti i campi della sorgente, poi sovrascrive i campi di sistema
    var payload = Object.assign({}, sorgente);
    delete payload.id;            // Supabase assegna nuovo UUID
    payload.numero_pos     = nuovoNP;
    payload.ordine         = nuovoNP * 10;
    payload.id_capitolo    = null; // la copia nasce fuori da qualsiasi capitolo
    payload.numero_pos_alfa = null;
    payload.stato          = 'attivo';
    delete payload.created_at;
    delete payload.updated_at;

    API.savePosizione('posizioni_serr', 'insert', payload, null, function(err, saved) {
      if (err) { alert('Errore durante la copia: ' + err); return; }
      if (saved) _posizioni.push(saved); // aggiorna memoria per il giro successivo
      rimasti--;
      prossimaInsert();
    });
  }
  prossimaInsert();
}

// ── FASE 5B-R2 — RIORDINO TOUCH SORTABLEJS ──────────────────────────────────

// Inizializza SortableJS su ogni .sortable-zone. Se il filtro non è 'tutti'
// o SortableJS non è disponibile, non inizializza nulla.
// Chiamata da renderPosizioni() dopo ogni rebuild del DOM.
function initSortable() {
  if (_filtro !== 'tutti') return;
  if (typeof Sortable === 'undefined') return;
  var zones = document.querySelectorAll('.sortable-zone');
  zones.forEach(function(zone) {
    var inst = Sortable.create(zone, {
      group:             { name: 'pos-serr', pull: true, put: true },
      handle:            '.pos-drag-handle',
      draggable:         '.pos-row',
      filter:            '.zona-hdr, .cap-sub, .zona-placeholder',
      animation:         150,
      delay:             250,
      delayOnTouchOnly:  true,
      ghostClass:        'pos-row-ghost',
      chosenClass:       'pos-row-chosen',
      dragClass:         'pos-row-dragging',
      onStart: function()  { _dragInCorso = true; },
      onEnd:   function()  { _dragInCorso = false; salvaRiordinoTouchSerr(); }
    });
    _sortableInstances.push(inst);
  });
}

// Sequenza batch callback: esegue un array di funzioni (items) in serie,
// ognuna riceve un cb(err). Se un item fallisce, interrompe la catena.
function _batchPatch(items, onDone) {
  var i = 0;
  function next(err) {
    if (err) { onDone(err); return; }
    if (i >= items.length) { onDone(null); return; }
    items[i++](next);
  }
  next(null);
}

// Ricostruisce ordine e capitoli dal DOM dopo ogni drag & drop.
// Fonte di verità: la zona DOM in cui ogni .pos-row si trova dopo il rilascio.
// Assegna ordine = (indice_globale + 1) * 10 a ogni posizione.
// Determina id_capitolo dalla data-cap-id della zona.
// Aggiorna ordine_inizio/ordine_fine per i capitoli non vuoti.
// Gestisce capitoli vuoti con conferma utente.
// Non tocca mai numero_pos, numero_pos_alfa o campi tecnici.
function salvaRiordinoTouchSerr() {
  if (_salvataggioRiordino) return;
  _salvataggioRiordino = true;

  var zones   = document.querySelectorAll('.sortable-zone');
  var posBatch  = [];   // { id, nuovoOrdine, nuovoCapId }
  var capBatch  = [];   // { id, nuovoInizio, nuovoFine }
  var capsVuoti = [];   // { id, titolo }
  var globalIdx = 0;
  var emptyMarkerSeq = 0; // progressivo per rendere univoci i marker di capitoli vuoti consecutivi

  zones.forEach(function(zone) {
    var capId = zone.getAttribute('data-cap-id');
    var rows  = zone.querySelectorAll('.pos-row');
    var ordiniZona = [];

    rows.forEach(function(row) {
      var posId    = row.getAttribute('data-id');
      var nuovoOrd = (globalIdx + 1) * 10;
      globalIdx++;
      ordiniZona.push(nuovoOrd);
      posBatch.push({
        id:        posId,
        nuovoOrdine: nuovoOrd,
        nuovoCapId:  (capId === '__fuori__') ? null : capId
      });
    });

    // Aggiorna bounds del capitolo non vuoto
    if (capId !== '__fuori__' && ordiniZona.length > 0) {
      capBatch.push({
        id:        capId,
        nuovoInizio: Math.min.apply(null, ordiniZona) - 0.5,
        nuovoFine:   Math.max.apply(null, ordiniZona) + 0.5
      });
    }

    // Capitolo rimasto vuoto:
    // aggiunge comunque in capBatch con bounds collassati (marker = marker) per
    // evitare che vecchi ordine_inizio/ordine_fine intercettino posizioni di altri
    // capitoli nel confronto stretto dei report (ordine > ini && ordine < fine).
    // Il marker è coerente con la posizione della zona nel DOM.
    if (capId !== '__fuori__' && ordiniZona.length === 0) {
      emptyMarkerSeq++;
      var marker = (globalIdx * 10) + 5 + (emptyMarkerSeq * 0.001); // univoco tra capitoli vuoti consecutivi
      capBatch.push({
        id:        capId,
        nuovoInizio: marker,
        nuovoFine:   marker   // range collassato: nessuna posizione può verificare ordine > marker && ordine < marker
      });
      var cap = _capitoli.find(function(c){ return c.id === capId; });
      if (cap) capsVuoti.push({ id: capId, titolo: cap.titolo });
    }
  });

  // Posizioni fuori capitolo (avviso non bloccante)
  var fuoriZone = document.querySelector('.sortable-zone[data-cap-id="__fuori__"]');
  var nFuori = fuoriZone ? fuoriZone.querySelectorAll('.pos-row').length : 0;

  // Avvia il salvataggio batch
  var posPatchItems = posBatch.map(function(p) {
    return function(cb) {
      API.writeRecord('update', 'posizioni_serr',
        { id: p.id, ordine: p.nuovoOrdine, id_capitolo: p.nuovoCapId }, cb);
    };
  });
  var capPatchItems = capBatch.map(function(c) {
    return function(cb) {
      API.writeRecord('update', 'capitoli_rilievo',
        { id: c.id, ordine_inizio: c.nuovoInizio, ordine_fine: c.nuovoFine }, cb);
    };
  });

  _batchPatch(posPatchItems.concat(capPatchItems), function(err) {
    _salvataggioRiordino = false;
    if (err) { alert('Errore nel salvataggio del riordino: ' + err); return; }

    // Aggiorna _posizioni in memoria
    posBatch.forEach(function(pb) {
      var p = _posizioni.find(function(x){ return x.id === pb.id; });
      if (p) { p.ordine = pb.nuovoOrdine; p.id_capitolo = pb.nuovoCapId; }
    });
    // Aggiorna _capitoli in memoria
    capBatch.forEach(function(cb) {
      var c = _capitoli.find(function(x){ return x.id === cb.id; });
      if (c) { c.ordine_inizio = cb.nuovoInizio; c.ordine_fine = cb.nuovoFine; }
    });

    // miniSync per allineare DBLocal
    API.miniSync('posizioni_serr', function() {
      API.miniSync('capitoli_rilievo', function() {});
    });

    renderPosizioni();

    // Avviso posizioni fuori capitolo
    if (nFuori > 0) {
      setTimeout(function(){
        alert(nFuori + ' posizione/i si trovano fuori da ogni capitolo.\nPuoi assegnarle a un capitolo tramite il pulsante Capitoli.');
      }, 300);
    }

    // Gestione capitoli vuoti con conferma
    if (capsVuoti.length > 0) {
      setTimeout(function(){
        var titoli = capsVuoti.map(function(c){ return '"' + c.titolo + '"'; }).join(', ');
        if (confirm('I seguenti capitoli sono rimasti senza posizioni: ' + titoli + '.\nVuoi eliminarli?')) {
          var elimItems = capsVuoti.map(function(c) {
            return function(cb) {
              API.writeRecord('update', 'capitoli_rilievo', { id: c.id, stato: 'eliminato' }, cb);
            };
          });
          _batchPatch(elimItems, function(errElim) {
            if (errElim) { alert('Errore eliminazione capitoli: ' + errElim); return; }
            capsVuoti.forEach(function(cv){
              _capitoli = _capitoli.filter(function(c){ return c.id !== cv.id; });
            });
            API.miniSync('capitoli_rilievo', function() {});
            renderPosizioni();
          });
        }
      }, 400);
    }
  });
}

// ── FINE FASE 5B-R2 ──────────────────────────────────────────────────────────
// Rilegge posizioni_serr e capitoli_rilievo da DBLocal e aggiorna la lista.
// Chiamata dal listener pageshow quando la pagina viene ripristinata da bfcache
// (es. history.back() da capitoli.html). Non ricarica rilievo/cantieri/db_serramento.

  DBLocal.getAll('posizioni_serr', function(pos) {

      return p.id_rilievo === idRilievo && p.stato === 'attivo';

      });
      renderPosizioni();
    });
  });
}
